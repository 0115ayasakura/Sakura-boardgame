        const col = c.mortgaged ? "#6f7688" : (c.owner === "user" ? "#3f8fd8" : "#e0506e");
        layers.push(`<g transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)}) scale(${k})"
          opacity="${c.mortgaged ? 0.62 : 1}">
          <path d="M-50,-6 L0,-50 L50,-6 Z" fill="${col}" stroke="#ffffff" stroke-width="6"
            stroke-linejoin="round"/>
          <rect x="-36" y="-8" width="72" height="52" rx="4" fill="${col}"
            stroke="#ffffff" stroke-width="6"/>
          <rect x="-9" y="14" width="18" height="30" rx="2" fill="#ffffff" opacity="0.92"/>
          <circle cx="34" cy="34" r="27" fill="${col}" stroke="#ffffff" stroke-width="6"/>
          <path d="M21,34 L30,43 L48,25" fill="none" stroke="#ffffff" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/></g>`);
        continue;
      }
      const s = 0.40;                     // 图标半宽（格宽的一半 = 0.5；留一点金边）
      // ⚠️ 格心就在整数格点上（美术那边如此，紫圈当年也是按 (c.x, c.y) 定位的）——
      // 别再加 ±0.5 偏移，那会把图标画到两格之间的棱上（2026-09-30 实测错位）
      const p00 = pj(c.x - s, c.y - s, c.h || 0);
      const p10 = pj(c.x + s, c.y - s, c.h || 0);
      const p01 = pj(c.x - s, c.y + s, c.h || 0);
      const a = p10[0] - p00[0], b = p10[1] - p00[1];
      const cc = p01[0] - p00[0], d = p01[1] - p00[1];
      layers.push(`<image href="/art/icons/property_owned_${kind}.png" x="0" y="0"
        width="1" height="1" preserveAspectRatio="none"
        transform="matrix(${a.toFixed(3)},${b.toFixed(3)},${cc.toFixed(3)},${d.toFixed(3)},${p00[0].toFixed(1)},${p00[1].toFixed(1)})"
        opacity="${c.mortgaged ? 0.55 : 1}"/>`);
    }
  } else if (isGrid) {
    /* 格子棋盘（没有底图时的退路）：照参考图的画法 —— 2:1 等距、一块块**有厚度的立体砖**。
       ① 底下铺一块深色台面（带细网格）
       ② 四周立一圈白色围合方块（参考图里那些高高的白块）
       ③ 路线上每一格是一块厚砖：顶面深色 + **金色描边**、两个侧面浅灰，
          高度 = 该格的台阶高度 h（相邻格差一级就是一级台阶）
       ④ 每块砖顶面画一个**青色箭头**指向路线下一格（这是"路线怎么走"唯一需要看懂的东西）
       ⑤ 传送门画成青色虚线弧 + 两端小圈（有向的，中点上再加一个箭头）
       画序：按 col+row 从小到大（等距的后画覆盖先画），台面和围合块按同一把尺子排进去。 */
    const item = [];
    try {
    const P = (col, row, h) => {
      const p = isoRaw(col, row, h);
      return [p[0] + ISO.offX, p[1] + ISO.offY];
    };
    const colsN = Math.max(...game.cells.map(c => c.col ?? 0)) + 1;
    const rowsN = Math.max(...game.cells.map(c => c.row ?? 0)) + 1;
    const pts = (list) => list.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    // 一块等距长方体（col/row 是格坐标，h 是抬高几级，s 是厚度）
    const box = (col, row, h, s, top, left, right, trim) => {
      const [x, y] = P(col, row, h);
      const hw = ISO.tile / 2, hh = ISO.tile / 4;
      const N = [x, y - hh], E = [x + hw, y], S = [x, y + hh], W = [x - hw, y];
      const dn = (p) => [p[0], p[1] + s];
      return `<polygon points="${pts([W, S, dn(S), dn(W)])}" fill="${left}"/>`
        + `<polygon points="${pts([S, E, dn(E), dn(S)])}" fill="${right}"/>`
        + `<polygon points="${pts([N, E, S, W])}" fill="${top}"`
        + (trim ? ` stroke="${trim}" stroke-width="2.6" stroke-linejoin="round"` : "")
        + `/>`;
    };
    // ① 台面 + 网格
    const plate = [P(-0.72, -0.72, 0), P(colsN - 0.28, -0.72, 0),
                   P(colsN - 0.28, rowsN - 0.28, 0), P(-0.72, rowsN - 0.28, 0)];
    item.push({ z: -1e6, svg: `<polygon points="${pts(plate)}" fill="#2b3446"/>` });
    for (let i = 0; i <= colsN; i += 1) {
      const a = P(i - 0.5, -0.72, 0), b = P(i - 0.5, rowsN - 0.28, 0);
      item.push({ z: -1e6 + 1, svg: `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}"
        x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#3b475f" stroke-width="1.5"/>` });
    }
    for (let j = 0; j <= rowsN; j += 1) {
      const a = P(-0.72, j - 0.5, 0), b = P(colsN - 0.28, j - 0.5, 0);
      item.push({ z: -1e6 + 1, svg: `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}"
        x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#3b475f" stroke-width="1.5"/>` });
    }
    // ② 四周白色围合块（纯装饰，参考图里那些高高的白块）
    const walls = [];
    for (let col = 0; col < colsN; col += 1) {
      walls.push([col, -1.15], [col, rowsN - 0.85]);
    }
    for (let row = 0; row < rowsN; row += 1) {
      walls.push([-1.15, row], [colsN - 0.85, row]);
    }
    walls.forEach(([col, row], i) => {
      const tall = (i % 3 === 0) ? 2 : 1;
      item.push({ z: col + row + 0.1, svg: box(col, row, tall, 96 + tall * 22,
        "#f2f5fa", "#dbe2ec", "#b7c1d0") });
    });
    // ③ 路线砖（六种形式的顶面配色；地产按街区上色）
    const districtColors = { gakuen: "#3f6ea8", shopping: "#a8504c", daily: "#3f7d5c", taboo: "#5b5670" };
    const topOf = (c) => {
      if (c.type === "start" || c.type === "end") return "#b98b34";
      if (c.type === "device") return "#2f4f7e";
      if (c.type === "tower") return "#5b4a86";
      if (c.type === "property") {
        if (c.owner) return c.owner === "user" ? "#4a8bc9" : "#d95a72";
        return c.group ? (districtColors[c.group] || "#2b3446") : "#2b3446";
      }
      if (c.type === "shop") return "#7a5aa8";
      if (c.type === "game") return "#a8562f";
      if (c.type === "coin") return "#8a7326";
      if (c.type === "event") return "#2f6e5a";
      return "#2b3446";
    };
    for (const c of game.cells) {
      const z = (c.col ?? 0) + (c.row ?? 0);
      item.push({ z, svg: box(c.col ?? 0, c.row ?? 0, c.h || 0, ISO.slab,
        topOf(c), "#e3e8f0", "#b9c3d2", "#e6c169") });
      if (c.type === "device" || c.type === "tower") {
        const [x, y] = isoPos.get(c.id);
        item.push({ z: z + 0.3, svg: `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"
          rx="${(ISO.tile * 0.3).toFixed(1)}" ry="${(ISO.tile * 0.15).toFixed(1)}"
          fill="none" stroke="${c.type === "tower" ? "#b98be8" : "#7fd8ee"}"
          stroke-width="3" stroke-dasharray="7 6"/>` });
      }
      // 只画"沿着路线往前一格"的箭头（传送门另外画），这样路线一眼看得懂
      let nxt = null;
      for (const nid of ((state.moves && state.moves[String(c.id)]) || [])) {
        const n = game.cells[nid];
        if (!n) continue;
        if (Math.abs((n.col ?? 0) - (c.col ?? 0)) + Math.abs((n.row ?? 0) - (c.row ?? 0)) === 1) { nxt = n; break; }
      }
      if (nxt) {
        const a = isoPos.get(c.id), b = isoPos.get(nxt.id);
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
        item.push({ z: z + 0.35, svg: `<g transform="translate(${a[0].toFixed(1)},${a[1].toFixed(1)}) rotate(${ang.toFixed(1)})">`
          + `<path d="M-10,-15 L16,0 L-10,15 Z" fill="#46d2ea" stroke="#1d6f86" stroke-width="1.6" opacity="0.95"/></g>` });
      }
    }
    // ⑤ 传送门（有向）：虚线弧 + 两端圈 + 中间一个箭头。
    // ⚠️ 只画**挨得近**的那几对：终点→起点那条是"一圈走完回起点"的规则，不是地图上的门，
    // 拉一条横贯整张图的虚线弧只会糊住棋盘（2026-09-23）。
    for (const pair of (state.gates || game.gates || [])) {
      const a = game.cells[pair[0]], b = game.cells[pair[1]];
      if (!a || !b) continue;
      if (Math.abs((a.col ?? 0) - (b.col ?? 0)) + Math.abs((a.row ?? 0) - (b.row ?? 0)) > 4) continue;
      const pa = isoPos.get(a.id), pb = isoPos.get(b.id);
      const mx = (pa[0] + pb[0]) / 2 - (pb[1] - pa[1]) * 0.16;
      const my = (pa[1] + pb[1]) / 2 + (pb[0] - pa[0]) * 0.16;
      const ang = Math.atan2(pb[1] - pa[1], pb[0] - pa[0]) * 180 / Math.PI;
      item.push({ z: 1e5, svg: `<path d="M${pa[0].toFixed(1)},${pa[1].toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${pb[0].toFixed(1)},${pb[1].toFixed(1)}"
        fill="none" stroke="#7fd8ee" stroke-width="4" stroke-dasharray="11 9" stroke-linecap="round" opacity="0.95"/>`
        + `<circle cx="${pa[0].toFixed(1)}" cy="${pa[1].toFixed(1)}" r="15" fill="none" stroke="#7fd8ee" stroke-width="4"/>`
        + `<circle cx="${pb[0].toFixed(1)}" cy="${pb[1].toFixed(1)}" r="15" fill="none" stroke="#7fd8ee" stroke-width="4"/>`
        + `<g transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${ang.toFixed(1)})">`
        + `<path d="M-9,-13 L14,0 L-9,13 Z" fill="#7fd8ee" stroke="#1d6f86" stroke-width="1.6"/></g>` });
    }
    item.sort((p, q) => p.z - q.z);
    for (const it of item) layers.push(it.svg);
    } catch (err) {
      const detail = err && err.stack ? String(err.stack).split("\n").slice(0, 2).join(" | ") : "";
      layers.push('<text x="40" y="70" fill="#c0392b" font-size="22">等距棋盘渲染出错：'
        + ((err && err.message) || err) + '</text>');
      layers.push('<text x="40" y="104" fill="#c0392b" font-size="16">' + detail + '</text>');
    }
  } else {
    // 随机地图：主环（蛇形，宽路+虚线中线）与短支线（窄路）分开画，结构一眼能看出来
    const seg = (a, b, shoulder, surface) =>
      `<path d="M${cx(game.cells[a]).toFixed(1)},${cy(game.cells[a]).toFixed(1)} L${cx(game.cells[b]).toFixed(1)},${cy(game.cells[b]).toFixed(1)}"
        fill="none" stroke="${shoulder}" stroke-width="${shoulder === "#6f9ecb" ? 26 : 13}" stroke-linecap="round"/>` +
      `<path d="M${cx(game.cells[a]).toFixed(1)},${cy(game.cells[a]).toFixed(1)} L${cx(game.cells[b]).toFixed(1)},${cy(game.cells[b]).toFixed(1)}"
        fill="none" stroke="${surface}" stroke-width="${shoulder === "#6f9ecb" ? 18 : 7}" stroke-linecap="round"/>`;
    const trunkKey = (a, b) => (a < b ? `${a}_${b}` : `${b}_${a}`);
    const trunk = new Set();
    const order = (mainPath || []).slice();
    if (order.length > 1 && order[0] === order[order.length - 1]) order.pop();
    for (let i = 0; i < order.length; i += 1) {
      trunk.add(trunkKey(order[i], order[(i + 1) % order.length]));
    }
    const side = [];
    for (const [a, b] of (game.edges || [])) {
      if (a === b) continue;
      if (trunk.has(trunkKey(a, b))) {
        layers.push(seg(a, b, "#6f9ecb", "#ffffff"));
      } else {
        side.push([a, b]);
      }
    }
    // 主环中线（虚线）叠在白色路面之上
    for (const [a, b] of (game.edges || [])) {
      if (a === b || !trunk.has(trunkKey(a, b))) continue;
      layers.push(`<path d="M${cx(game.cells[a]).toFixed(1)},${cy(game.cells[a]).toFixed(1)} L${cx(game.cells[b]).toFixed(1)},${cy(game.cells[b]).toFixed(1)}"
        fill="none" stroke="#9cc0e8" stroke-width="2.2" stroke-dasharray="12 12" stroke-linecap="round"/>`);
    }
    for (const [a, b] of side) layers.push(seg(a, b, "#cbd8e8", "#eef3f9"));
  }

  // 6. 岔路选路（详见下面那段注释：平时不再画任何常驻箭头/路径）
  let hintSvg = "";
  const actor = game.pending && game.pending.type === "route"
    ? game.pending.player : (game.winner ? null : game.turn);
  const walkNode = game.walk && game.walk.path && game.walk.path.length
    ? game.walk.path[game.walk.path.length - 1] : null;
  let cameFrom = game.walk && game.walk.path && game.walk.path.length >= 2
    ? game.walk.path[game.walk.path.length - 2] : null;
  // 一回合的第一步没有"走过来的路径"，但引擎会用**上回合最后一步**堵住原路折返；
  // 网页不跟着堵的话，会给出一个引擎根本不接受的回头选项
  if (cameFrom === null && walkNode !== null && actor && game.positions
      && walkNode === game.positions[actor]) {
    const lastStep = (game.last_step || game.lastStep || {})[actor];
    if (lastStep && lastStep[1] === walkNode) cameFrom = lastStep[0];
  }
  const fromNode = walkNode !== null ? walkNode : (actor && game.positions ? game.positions[actor] : null);
  /* 岔路才画东西。用户 2026-09-30 把"棋子身旁的箭头气泡"也否了（短小臃肿、还把棋子挡住）：
     改成**悬在候选格正上方**的一支下指箭头——箭头浮在格子上方 40px 处，上下浮动呼吸，
     点箭头即选（data-node 仍是**紧邻的选项格**——引擎的 decide 只接受下一步）。
     箭头不在棋子身边，天然不挡棋子；候选格是哪个一眼可见。 */
  if (fromNode !== null && fromNode !== undefined && game.cells[fromNode]
      && game.pending && game.pending.type === "route" && game.pending.player === actor) {
    // 引擎在岔路上还拦"逆着路线走"的掉头选项（engine._road_preds，2026-09-30）；
    // 网页得拦同一批，不然会画出引擎根本不接受的回头箭头。
    const roadPreds = new Map();                       // 节点 → 它在官方路线上的来向格
    const addPred = (node, pred) => {
      if (!roadPreds.has(node)) roadPreds.set(node, new Set());
      roadPreds.get(node).add(pred);
    };
    const ring = (game.main_path || state.mainPath || []).slice();
    if (ring.length > 1 && ring[0] === ring[ring.length - 1]) ring.pop();
    for (let i = 1; i < ring.length; i++) addPred(ring[i], ring[i - 1]);
    for (const chain of (game.branches || state.branches || [])) {
      for (let i = 1; i < chain.length; i++) addPred(chain[i], chain[i - 1]);
    }
    // 随机图四面都能走，引擎不拦掉头 → 网页也不拦
    const kindKey = game.mapKind || game.map_kind;
    const preds = (kindKey === "city" || kindKey === "grid") ? (roadPreds.get(fromNode) || null) : null;
    const placed = (game.pending.options || [])
      .filter(o => o !== cameFrom && game.cells[o])     // 不标"刚才过来的路"（引擎同样禁止原路折返）
      .filter(o => !preds || !preds.has(o))
      .map(o => ({ node: o, cell: game.cells[o] }));
    placed.forEach((p) => {
      const a = _anchor(p.cell);
      // 箭头悬浮在候选格上方（立牌 88px 高，箭头抬到 44px 处、往上弹跳不碰棋子）
      const bx = a[0], by = a[1] - 44;
      hintSvg += `<g class="route-pick" data-node="${p.node}"
        transform="translate(${bx.toFixed(1)},${by.toFixed(1)})">
        <circle cy="10" r="34" fill="transparent"/>
        <g class="pick-arrow">
          <path d="M-9,-26 L9,-26 L9,-6 L20,-6 L0,16 L-20,-6 L-9,-6 Z"
            fill="#ffffff" stroke="#f0b429" stroke-width="3.4" stroke-linejoin="round"/>
        </g></g>`;
    });
  }
  /* 本回合的出发格：只在"这一回合还在走"的时候显示——game.walk 还在（含岔路待选），
     或者移动动画正在放（走完格子后服务端就把 walk 清了，动画期间由动画图层自己画这个圈）。 */
  const walking = !!(game.walk && game.walk.path && game.walk.path.length);
  if (walking && game.cells[game.walk.path[0]]) hintSvg += turnStartMark(game.cells[game.walk.path[0]]);
  const markup=layers.join("");const svgChanged=svg._markup!==markup;
  if(svgChanged){svg.innerHTML=markup;svg._markup=markup;mapState.perf.staticRebuilds++;}

  /* 行进方向箭头：主环折线必须先按"行进方向"定向——折线的点序是画图定的，
     不一定和 main_path 顺序（顺时针）同向。判据：把主环节点按顺序映射到折线最近点索引，
     行进时索引应当总体递增；总体递减就把折线反转。 */
  const measure = svg.querySelector("#ring-measure");
  const dirLayer = svg.querySelector("#dir-layer");
  if (svgChanged && measure && dirLayer && ring.length > 3) {
    const ringPts = toScreen((decor.roads || []).find(r => r.role === "ring").pts);
    const idxOf = (cell) => {
      let best = 0, bd = 1e12;
      ringPts.forEach((p, i) => {
        const d = (p[0] - cx(cell)) ** 2 + (p[1] - cy(cell)) ** 2;
        if (d < bd) { bd = d; best = i; }
      });
      return best;
    };
    let sum = 0;
    let prev = idxOf(game.cells[ring[0]]);
    for (let i = 1; i < ring.length; i++) {
      const cur = idxOf(game.cells[ring[i]]);
      sum += Math.sign(cur - prev);
      prev = cur;
    }
    const oriented = sum < 0 ? ringPts.slice().reverse() : ringPts;
    const dPath = oriented.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    measure.setAttribute("d", dPath + " Z");
    const total = measure.getTotalLength();
    const count = Math.max(6, Math.round(total / (SPACING * 1.9)));
    const marks = [];
    for (let i = 0; i < count; i++) {
      const at = total * (i + 0.5) / count;
      const p = measure.getPointAtLength(at);
      const q = measure.getPointAtLength(Math.min(total, at + 3));
      const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      marks.push(chevron(p.x, p.y, ang, 13, "#3f6fa8", "0.95"));
    }
    dirLayer.innerHTML = marks.join("");
  }

  const frag = [];
  game.cells.forEach((c) => {
    const an = _anchor(c);
    const wx = an[0], wy = an[1];
    const g = c.group ? GROUPS[c.group] : null;
    const ring = g ? g.color : (c.type === "start" || c.type === "end" ? "#e8a91f" : "#9bb4d4");
    const badge = c.type !== "property" && c.type !== "start" && c.type !== "end" ? " badge" : "";
    const start = c.type === "start" || c.type === "end" ? " start" : "";
    // 钉尖落点（锚点）压在路线上的节点处，图钉本体向上展开，不遮路线
    frag.push(`<span class="pdot${start}" style="--ring:${ring};left:${wx}px;top:${wy}px"></span>`);
    frag.push(`<div class="cell${badge}${start} ${c.owner && String(c.id) !== String(state.arrivalHold) ? "owned" : ""} ${c.mortgaged ? "mortgaged" : ""}"
      data-id="${c.id}" data-wx="${wx}" data-wy="${wy}"
      style="--ring:${ring};left:${wx}px;top:${wy}px">${cellHTML(c)}</div>`);
  });
  const tokenImgs = { user: "/art/avatar_user.svg", sakura: opponent().portrait };
  const actorNow = game.pending && game.pending.type === "route"
    ? game.pending.player : (game.winner ? null : game.turn);
  // 两个棋子踩在同一格：立牌错开站立，别叠在一起
  const sameCell = game.positions.user === game.positions.sakura;
  const pieces = (state.pieces && state.pieces.options) ? state.pieces : null;
  /* 立牌高度：用户 2026-09-30 二次反馈"依旧太小"——提到 112px（同格 84）。
     4800 渲染图一格约 138px，112px 站在格子里是"显眼但不铺满"的档。 */
  const standeeH = mapState.render ? (sameCell ? 84 : 112) : (sameCell ? 74 : 104);
  /* 棋子元素**常驻**（2026-10-01）：两个 <img> 只在结构重建时创建，之后每次渲染只改
     src/left/top/class —— 以前每次渲染都重建 <img>，立绘大图反复解码（切棋子卡顿的来源）。 */
  const piecesLayer = $("#pieces-layer");
  if (!mapState.pieceEls || mapState.pieceElsKey !== staticKey) {

  }

    const py = anim ? anim.current[1] : base[1];

      else if (el.getAttribute("src") !== wantSrc) el.setAttribute("src", wantSrc);
      const wantCls = `token ${p} ${actorNow === p ? "active-turn" : ""}`;

     这里只记录"该看哪儿"，具体平移在 applyTransform 里做（那是所有路径的必经之地）。 */
  const movingActor=(state.visualMovePending&&state.visualMovePending.player)||(state.moveAnim&&state.moveAnim.player);
  const focusPlayer = movingActor || actorNow || game.turn || "user";

  if (!demo && (mapState.focusActor !== focusPlayer || mapState.lastGameSeq !== state.gameSeq)) {
    if (mapState.lastGameSeq !== state.gameSeq) mapState.zoomTouch = null;   // 新的一局：默认档重新生效
    mapState.focusActor = focusPlayer;
    mapState.follow = true;
    // ⚠️ 只在"这一局用户还没自己缩过"时才改缩放 —— 否则人刚滚轮缩开看全图，
    // 下一手又被拉近，等于把滚轮控制权抢走了（用户明确要"仍可用滚轮控制大小"）
    if (mapState.zoomTouch == null) {

    g.addEventListener("pointerdown", (e) => {

  } /* ==== DOM 渲染分支结束（3D 分支在上面）==== */

  if (!mapState.use3D) initPanZoom(bounds);   // 3D 模式的拖拽/滚轮由 board3d 自己接（绑在 canvas 上）
  /* 镜头"居中到两枚棋子中间"只在**新一局**做一次（以前每个 version 都做 ——
     每次掷骰镜头都会突然往中间抽一下，用户说的"掷骰子背景神秘抽动"就是它）。
     平时的镜头交给"追踪行动棋子"那条平滑跟随（mapState.focus + applyTransform）。 */
  if(seqChanged)mapState.pendingCenter=null;
  mapState.lastVersion = state.version;
  renderMonopolyInfo(game);

}

    return `<span class="pin-chip" style="--ring:${ring}"><i class="band" style="background:${ring}"></i>

          (dismissed ? ` <button class="gold" onclick="state.shopDismissed=false;showShop(state.game.pending);">🛒 打开商店</button>` : "");
      } else {
        const labels = { buy: "买入", upgrade: `升级 ¥${pendingUpgradeCost(game.pending, game.cells[game.pending.cell])}`, mortgage: "抵押", redeem: "赎回", sell: "卖掉", skip: "跳过" };
        html = `<span class="hint">${game.cells[game.pending.cell].name}：</span>` +
          game.pending.options.map(o =>
            `<button class="${o === "skip" ? "ghost" : ""}" onclick="api('decide',{action:'${o}'}).then(()=>poll())">${labels[o] || o}</button>`).join("");
      }
    } else if (game.pending || game.walk) {
      const waiting = { dice: "正在挑骰子点数", shop: "正在逛商店" }[game.pending && game.pending.type]
        || (game.pending ? "正在决策" : "走格子中");
      html = `<button class="pink" onclick="requestSakuraAction()">请${NAMES.sakura}行动</button>
        <span class="hint">${NAMES.sakura}${waiting}…</span>`;
    } else if (game.turn === "user") {
      const customHeld = !!(game.flags && game.flags.user && game.flags.user.pick_dice);
      const customLocked = !customHeld || !presentationSnapshot().allows('ordinary');
      html = `<button data-ordinary-roll onclick="api('roll').then(()=>poll())">🎲 掷骰子</button>
        <button class="gold" data-custom-die ${customLocked ? 'disabled' : ''} onclick="useCustomDie()" title="持有上限 1；普通掷骰不消耗，选点成功后才消耗">🎯 自定义骰（${customHeld ? '1' : '0'}/1）</button>
        <span class="hint">轮到你了，普通掷骰随机，自定义骰可择机使用</span>`;
    } else {
      html = `<button class="pink" onclick="requestSakuraAction()">请${NAMES.sakura}行动</button>
        <span class="hint">轮到${NAMES.sakura}了</span>`;
    }
  } else if (game.kind === "gomoku") {
    if (game.turn === "user") {
      html = `<span class="hint">轮到你了，点击棋盘落子</span>`;
    } else {
      html = `<button class="pink" onclick="requestSakuraAction()">请${NAMES.sakura}行动</button>
        <span class="hint">${NAMES.sakura}思考中…</span>`;
    }
  }
  // 对局进行中也给几个便利入口：自动模式、悔棋、重开
  if (!demo && game && !game.winner && !game.draw) {
    const on = (state.autoMode || "off") === "hers";
    html += ` <button class="${on ? "gold" : "ghost"}" onclick="toggleAutoMode()" title="${driverLabel}：每次只请求一个决策，动画与事件确认后再继续；失败、超时或取消后须手动重试，不会回退算法。">${on ? `自动：${NAMES.sakura}的回合` : "自动模式：关"}</button> <span class="hint">${driverLabel}</span>`;
    if (game.kind === 'gomoku' && state.canUndo) {
      html += ` <button class="ghost" onclick="undoMove()" title="五子棋撤回一手">↩ 悔棋</button>`;
    }
    html += ` <button class="ghost" onclick="restartGame('${game.kind}')">重开一局</button>`;
  }
  if (agent?.paused) html += ` <span class="hint" role="status">自动行动已暂停：${esc(agent.error)}</span>`;
  bar.innerHTML = html;
  BlackTrainView.bind(bar, game, async (action, payload) => { if (action === 'act_sakura') return requestSakuraAction(); await api(action, payload); await poll(); });
  syncOrdinaryRollButtons();
  scheduleAutoStep(demo);
}

// Refresh only button properties: never rebuild the board or advance automatic play.
// Closing a local modal does not change the authoritative game version.
function syncOrdinaryRollButtons() {
  const custom = document.querySelector('[data-custom-die]');
  const normal = document.querySelector('[data-ordinary-roll]');
  if (!custom && !normal) return;
  const game = state.game;
  const reason = !game || game.kind !== 'monopoly' || game.turn !== 'user' || game.winner || game.draw
    ? '尚未轮到你投掷'
    : game.pending || game.walk ? '请先完成当前行动'
    : presentationSnapshot().reason;
  if (normal) { normal.disabled = !!reason; normal.title = reason || '随机投掷，不消耗自定义骰'; }
  if (custom) {
    const unavailable = reason || (!game?.flags?.user?.pick_dice ? '未持有自定义骰' : '');
    custom.disabled = !!unavailable;
    custom.title = unavailable || '自选移动点数；选点成功后消耗，持有上限1';
  }
}

// Observe fixed modal roots only, not every changing die/board node.
if (typeof MutationObserver !== 'undefined') {
  const rollButtonObserver = new MutationObserver(syncOrdinaryRollButtons);
  document.querySelectorAll('.modal').forEach(modal =>
    rollButtonObserver.observe(modal, {attributes:true, attributeFilter:['class']}));
}

async function useCustomDie() {
  const game = state.game;
  if (!game || game.kind !== 'monopoly' || game.turn !== 'user' || game.pending || game.walk || game.winner
      || !game.flags?.user?.pick_dice || !presentationSnapshot().allows('ordinary')) return;
  await api('roll', { use_custom_die: true });
  await poll();
}

/* ---------- 自动模式：轮到她就自动走完（只有开/关两种） ---------- */
function syncAutoModeSnapshot(data) {
  const mode = data.autoMode || 'off';
  const changed = state.autoMode !== mode;
  state.autoMode = mode;
  return changed;
}
function toggleAutoMode() {
  const next = (state.autoMode || "off") === "hers" ? "off" : "hers";
  const epoch = uiEpoch, gameSeq = state.gameSeq;
  return api("set_auto_mode", { mode: next }).then((res) => {
    if (epoch !== uiEpoch || gameSeq !== state.gameSeq) return;
    if (res && res.ok) state.autoMode = next;
    if (res && res.status) toast(res.status);
    return poll();
  });
}

let autoTimer = null;
function autoCanRun(demo) {
  const game=state.game, flow=presentationSnapshot();
  const pending=game?.pending, walk=game?.walk;
  // BlackTrainView owns only black_train events, not shared-map route/dice
  // continuations. Admit known role choices only when their movement agrees.
  const blackRole = game?.turn === 'sakura' && (!pending ? !walk
    : pending.player === 'sakura' && (pending.kind == null || pending.kind === pending.type)
      && Array.isArray(pending.options) && pending.options.length > 0
      && (pending.type === 'dice' ? !walk
        : pending.type === 'route' && walk?.player === 'sakura'
          && Number.isInteger(walk.steps_left) && walk.steps_left > 0
          && pending.steps_left === walk.steps_left));
  return !!(game && !game.winner && !game.draw && !demo && (state.autoMode || 'off') === 'hers'
    && !(state.agentUI && (AgentUI.busy(state.agentUI) || state.agentUI.paused))
    && (!flow.blackActive || blackRole)
    && flow.allows('auto', flow.blackActive ? 'black-roll' : '')
    && (game.turn === 'sakura' || game.pending?.player === 'sakura'));
}
function scheduleAutoStep(demo) {
  if(!autoCanRun(demo)){clearTimeout(autoTimer);autoTimer=null;return;}
  if(autoTimer)return;
  const epoch=uiEpoch, gameSeq=state.gameSeq;
  autoTimer=setTimeout(()=>{
    autoTimer=null;
    if(epoch===uiEpoch && gameSeq===state.gameSeq && autoCanRun(demo))api('act_sakura').then(()=>poll());
  },1800);
}

function undoMove() {
  api("undo").then((res) => {
    if (res && res.ok) {resetTowerFlowUI();toast(res.status);}
    poll();
  });
}

function restartGame(kind) {
  if (!window.confirm("重开一局？当前这局的进度会丢弃。")) return;
  api("start", { game: kind }).then(res => {if(res.ok)resetTowerFlowUI();poll();});
}

/* ---------- 五子棋 ---------- */
function gomokuStyleDescription(settings) {
  const value = Number(settings.style);
  const label = value < 30 ? '稳健' : value < 65 ? '均衡' : '进攻';
  return settings.styleFollowCard
    ? `来源：角色卡 · 当前偏${label}`
    : `来源：手动选择 · 当前偏${label}`;
}
function renderGomoku(game, demo) {
  mapState.use3D = false;
  mapState.board3d?.dispose(); mapState.board3d = null;
  mapState.staticKey = null; // Gomoku replaces boardWrap; Monopoly must rebuild on return.
  mapState.viewportObserver?.disconnect();
  if (mapFrame) mapFrame(); mapFrame = null; mapFrameAt = 0; mapState.canvas = null;
  const size = game.board.length;
  // 棋盘自适应：按可用空间取最大格径（16 行含表头）
  const availW = boardWrap.clientWidth - 80, availH = boardWrap.clientHeight - 150;
  const cell = Math.max(24, Math.min(46, Math.floor(Math.min(availW / (size + 1), availH / (size + 1)))));
  document.documentElement.style.setProperty("--gcell", cell + "px");
  // 注意：#action-bar 必须在这里创建——以前只有大富翁的模板里有它，
  // 导致五子棋从来没有「请夜乃樱行动」「重开一局」任何按钮
  let html = `<div id="action-bar"></div><div id="gomoku"><div><table>`;
  for (let tr = 0; tr <= size; tr++) {
    html += "<tr>";
    for (let tc = 0; tc <= size; tc++) {
      if (tr === 0 && tc === 0) { html += `<td class="head"></td>`; continue; }
      if (tr === 0) { html += `<td class="head">${tc}</td>`; continue; }
      if (tc === 0) { html += `<td class="head">${tr}</td>`; continue; }
      const v = game.board[tr - 1][tc - 1];
      // 演示盘也可以直接点：服务器对 place 有冷启动兜底（没开局就自动开一局五子棋），
      // 所以点下去 = 开真局 + 落这颗子，不再让人对着一块点不动的演示盘发呆
      const playable = !game.winner && !game.draw && (demo || (game.turn === "user" && !v));
      const Stone = v ? `<span class="stone ${v === 1 ? "user" : "sakura"}"></span>` : "";
      html += `<td class="${playable ? "playable" : ""}" ${playable ? `onclick="api('place',{row:${tr},col:${tc}}).then(()=>poll())"` : ""}>${Stone}</td>`;
    }
    html += "</tr>";
  }
  html += `</table><div class="legend">○ 玩家　● ${NAMES.sakura}</div></div></div>`;
  boardWrap.innerHTML = html + (demo ? `<span class="demo-badge">演示棋盘 · 直接点棋盘就能开局落子</span>` : `<span class="live-badge">${game.winner || game.draw ? "对局已结束" : "对局进行中"}</span>`);

  $("#info-card").style.display = "";
  // 难度与棋风：各自成行，按钮之间留出间距（之前挤成一团）
  const optBtn = (on, color, text, action) =>
    `<button class="opt-btn" style="background:${on ? color : "#fff"};color:${on ? "#fff" : "var(--ink)"}"
      onclick="${action}">${text}</button>`;
  const diffSelect = [1, 2, 3].map(l =>
    optBtn(l === state.difficulty, "var(--blue)", ["", "入门", "进阶", "困难"][l],
          `api('set_difficulty',{level:${l}}).then(()=>poll())`)).join("");
  const styleSelect = [[15, "稳健"], [45, "均衡"], [80, "进攻"]].map(([v, label]) =>
    optBtn(!state.styleFollowCard && Math.abs(state.style - v) < 20, "var(--pink-deep)", label,
          `api('set_style',{style:${v}}).then(()=>poll())`)).join("");
  // 棋风默认跟随角色卡（和大富翁的打法性格同源）；点了上面三个按钮就切成手动
  const styleNote = gomokuStyleDescription(state);
  const rolls = game.first_rolls || {};
  const rollLine = (rolls.user && rolls.sakura)
    ? `先后手骰：玩家 ${rolls.user} · ${NAMES.sakura} ${rolls.sakura} → ${NAMES[game.first || game.turn]}先手<br>` : "";
  $("#info").innerHTML = rollLine + `第 ${game.move_count} 手${game.winner ? `，${NAMES[game.winner]} 获胜` : game.draw ? "，和棋（棋盘已满）" : ""}` +
    `<div class="opt-line"><span class="opt-label">AI 难度</span><span class="opt-row">${diffSelect}</span></div>` +
    `<div class="opt-line"><span class="opt-label">${NAMES.sakura}棋风</span><span class="opt-row">${styleSelect}</span></div>` +
    `<div class="sub" style="font-size:11px;margin-top:2px">${styleNote}</div>` +
    `<div class="sub" style="margin-top:8px;font-size:11px">稳健偏防守，进攻偏进攻，均衡兼顾两者；不影响上方 AI 难度。点击按钮会改为手动棋风；恢复角色卡控制需在插件设置开启「五子棋棋风跟随角色卡」。</div>`;
  renderDiceCard(game);
  renderActionBar(game, demo);
}

    失败、超时、宿主忙或取消后会暂停，必须手动重试，不会反复请求。取消只撤销本次决策许可，不保证停止语音，也不能撤回已走的棋。</p>
    <p>「一次把整局推完」不在这个按钮里——那是聊天里的指令（对她说「你们自己下一局」），
    适合你只想看个结果的时候；常驻模式只保留"替她走她的回合"，免得一局在你不注意时被快进掉。</p>
    <h4>悔棋</h4>
    <p>仅五子棋提供棋盘上方的 <b>「↩ 悔棋」</b>，可<b>撤回一手</b>；大富翁不显示悔棋按钮。
    快照只保留本进程最近的若干步（重启 Sakura 之后就没了），退回也会写进对局记录。</p>
    <h4>黑列车到站</h4>
    <p>双方普通行动合计完成第 <b>22</b> 次后预告，第 <b>26</b> 次完成后自动进入黑列车，双方都能看到公告，无需手动入场。探险期间双方各行动 5 次后返程。</p>
    <h4>地产操作：升级 / 抵押 / 赎回 / 卖掉</h4>    <p>走回<b>自己的地产</b>时，按地产状态和现金显示可用选项；现金不足以赎回时，仍可选择卖掉或跳过。</p>
    <ul>
      <li><b>升级</b>（基础费用为现价的一半；装修券减免50%，最多减免¥60，以按钮报价为准）→ 这块地租金 <b>×2</b>，每块地只能升 1 级。</li>
      <li><b>抵押</b>（拿回现价的一半）→ 应急周转。抵押期间这块地<b>收不到租金</b>（别人踩上去免费路过）、
        <b>不算进街区垄断</b>、也不能升级；地还是你的，以后能赎回来。<b>缺钱优先抵押，别急着卖。</b></li>
      <li><b>赎回</b>（付现价的六成）→ 把抵押的地恢复成正常状态、重新开始收租。
        <b>抵押→赎回走一圈净亏地价的一成</b>（半价拿到手、六成赎回来），而且地价每 8 回合会涨，隔越久赎回越贵。</li>
      <li><b>卖掉</b>（未抵押拿三分之一；抵押中只想脱手只拿六分之一）→ 地退回<b>无主</b>，之后任何人走到都能买。</li>
    </ul>
    <p>两点容易误会：<b>抵押不会让别人买走你的地</b>——地只有两种方式易主：你主动卖掉（回到无主），
    或者你破产（全部资产连同抵押状态移交债主，债主可以再赎回）；<b>抵押也不是白拿钱</b>，
    它等于先用将来的六成价换现在的一半现金，所以它只适合"短期周转、手头宽裕了就赎回来"。
    侧栏每块地的租金收益会随抵押立刻归零，可以照着看。</p>
    <h4>格子图例</h4>
    <div class="legend-grid">${legend}</div>
    <h4>${naviName} 事件卡图鉴（共 ${state.cards.length} 张）</h4>
    <div class="cards-grid">${cards}</div>
    <h4>五子棋</h4>
    <p>点击棋盘交叉点落子；${NAMES.sakura}的棋由内置 AI 按当前难度代算，落子理由会写进对局记录。开局时各掷一次骰子决定先后手。</p>
    <p style="margin-top:10px"><button style="border:none;border-radius:999px;padding:8px 22px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer" onclick="document.getElementById('help-modal').classList.remove('show')">知道了</button></p>`;
  $("#help-modal").classList.add("show");
  state.helpOpen = true;
}
$("#help-modal").addEventListener("click", (e) => {
  if (e.target.id === "help-modal") e.currentTarget.classList.remove("show");
});
// NAVI 事件弹窗：点击画面任意处（含背板）提前关闭
$("#card-modal").addEventListener("click", closeCard);
// 选棋子弹窗：点空白处 = 保持原样关掉（存下来的还是上一次的选择）
$("#piece-modal").addEventListener("click", (e) => {
  if (e.target.id === "piece-modal") e.currentTarget.classList.remove("show");
});
// 骰子弹窗：点击任意处关闭 —— 关掉之后才让棋子出发（用户 2026-09-30 定：
// 弹窗还开着棋子就先走，镜头和弹窗互相抢注意力）。真正开始走见 startPendingMove()。
$("#dice-modal").addEventListener("click", () => {
  closeResultModal("#dice-modal", "#big-die");
  clearTimeout(state.diceAutoTimer);
  startPendingMove();
});
// 商店 / 游戏 / 判定弹窗：点击背板或"关闭"收掉（判定弹窗关掉顺手把走格放行）
$("#shop-modal").addEventListener("click", (e) => {
  if (e.target.id === "shop-modal") {
    // 关掉 = 这次不自动再弹（引擎还在等决策，操作条上留"打开商店"按钮）
    $("#shop-modal").classList.remove("show");
    state.shopDismissed = true;
  }
});
$("#game-modal").addEventListener("click", () => closeResultModal("#game-modal", "#game-die"));
$("#check-modal").addEventListener("click", () => closeResultModal("#check-modal", "#check-die"));

drawDie(6);
render();
poll();
// Completion-based polling: one request at a time, bounded backoff on failure.
window.addEventListener('pagehide',()=>connection.dispose());
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
/* three.js 库是异步加载的，经常比首次渲染慢一步；而 poll 只在 state 变化时才重渲 ——
   不补这一班车的话，库就绪后再也没有 render，3D 永远不会挂上（实测就是这么卡在 DOM 版的）。 */
window.addEventListener("board3d:ready", () => { try { render(); } catch (_) {} });
window.addEventListener('board3d:lost',()=>{mapState.glFailed=true;setTimeout(()=>{try{render();syncTowerUI();toast('3D 暂不可用，已切回静态棋盘；刷新可重新尝试');}catch(e){console.warn(e);}},0);});
</script>
