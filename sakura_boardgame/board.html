<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜乃樱的桌游室</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #eef3fb;
    --panel: rgba(255, 255, 255, 0.88);
    --panel-line: rgba(120, 150, 200, 0.22);
    --ink: #3a415c;
    --ink-dim: #7a829e;
    --pink: #f2a7bd;
    --pink-deep: #e07a9a;
    --blue: #6fa8dc;
    --blue-deep: #4a86c8;
    --gold: #f0b429;
    --green: #67c58f;
    /* 本回合出发格：紫色在地图配色里没用过（金=路线/蓝红=双方棋子/四个街区的蓝红绿灰），不会撞色 */
    --start: #8b5cf6;
    --danger: #e8637e;
    --shadow: 0 6px 22px rgba(90, 120, 180, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 10% 12%, rgba(111,168,220,0.30), transparent 30%),
      radial-gradient(circle at 90% 10%, rgba(242,167,189,0.28), transparent 28%),
      radial-gradient(circle at 80% 92%, rgba(240,180,41,0.20), transparent 32%),
      radial-gradient(circle at 18% 88%, rgba(103,197,143,0.18), transparent 30%),
      linear-gradient(165deg, #f4f8fd, #e6eefa);
  }
  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; padding: 14px 20px; gap: 12px; }

  header { display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 24px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(90deg, var(--blue-deep), var(--pink-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tabs { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #tabs button {
    border: 2px solid transparent; background: rgba(255,255,255,0.75); color: var(--ink-dim);
    padding: 6px 18px; border-radius: 999px; font-size: 14px; cursor: pointer; letter-spacing: 2px;
    transition: all .18s; box-shadow: 0 2px 8px rgba(90,120,180,0.10);
  }
  #tabs button:hover { color: var(--ink); transform: translateY(-1px); }
  #tabs button.on { background: linear-gradient(120deg, var(--blue), var(--pink)); color: #fff; letter-spacing: 3px; }
  #tabs button .live-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--gold); margin-left: 6px; vertical-align: middle;
    box-shadow: 0 0 6px rgba(240,180,41,0.8);
  }
  #tabs .help-btn { background: rgba(255,255,255,0.75); }

  main { display: flex; gap: 16px; flex: 1; min-height: 0; }

  /* ---------- 棋盘区 ---------- */
  #board-area { position:relative; flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:8px; }
  #board-wrap {
    flex: 1; min-width: 0; position: relative;
    background: linear-gradient(165deg, rgba(255,255,255,0.92), rgba(240,245,252,0.86));
    border: 1px solid var(--panel-line); border-radius: 18px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  #map-viewport { position: absolute; inset: 0; cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none; contain: layout paint; }
  #map-viewport.dragging { cursor: grabbing; }
  #map-canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0;
    /* will-change：整块画布提升成合成层。棋子走格/镜头跟随每帧都改 transform ——
       不提升的话宿主 WebView 每次都要重新光栅化 4800px 大图（棋子卡顿的最后一块，
       2026-10-01；DOM 侧的优化见 renderMonopoly 的结构复用注释）。 */
    will-change: transform; transform: translateZ(0); }
  #edges-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  #map-canvas .watermark {
    position: absolute; text-align: center; pointer-events: none; z-index: 0;
    white-space: nowrap;
  }
  #map-canvas .watermark .big { font-size: 52px; letter-spacing: 14px; color: rgba(74,134,200,0.055); font-weight: 800; }
  #map-canvas .watermark .small { font-size: 15px; letter-spacing: 6px; color: rgba(120,150,200,0.09); font-weight: 700; margin-top: 6px; }
  #map-canvas text.district-name {
    font-size: 34px; font-weight: 800; letter-spacing: 10px; opacity: 0.34; text-anchor: middle;
    dominant-baseline: middle; pointer-events: none;
    paint-order: stroke; stroke: rgba(255,255,255,0.8); stroke-width: 5px;
  }
  .demo-badge, .live-badge {
    position: absolute; left: 14px; bottom: 12px; z-index: 12; color: #fff; font-size: 12px;
    letter-spacing: 2px; border-radius: 999px; padding: 3px 12px;
  }
  .demo-badge { background: var(--gold); box-shadow: 0 2px 8px rgba(240,180,41,0.4); }
  .live-badge { background: var(--green); box-shadow: 0 2px 8px rgba(103,197,143,0.4); }
  #zoom-hint { position: absolute; right: 14px; bottom: 12px; z-index: 12; font-size: 11px; color: var(--ink-dim);
    background: rgba(255,255,255,0.85); border-radius: 999px; padding: 3px 10px; }

  /* ---------- 地标 = 地图图钉（钉尖指向路线上的点，路线不被盖住） ---------- */
  .cell {                                  /* 图钉容器：底边中点钉在路线节点上 */
    position: absolute;
    /* 往上抬一点：钉尖压在路面上、不盖住路中心（具体抬多少见 applyTransform，随地图类型不同） */
    transform: translate(-50%, calc(-100% - 8px));
    transform-origin: 50% 100%;
    display: flex; flex-direction: column; align-items: center;
    z-index: 3; will-change: transform; transition: transform .18s ease-out;
    cursor: default;
  }
  /* ---- 等距格子棋盘：地砖本身已经画了图标位，图钉只留一个小圆徽，
          名字与价格收进悬停牌（63 个牌子同时铺开会把棋盘糊掉——实测过） ---- */
  #map-canvas.iso .cell { transform: translate(-50%, calc(-100% - 4px)); }
  #map-canvas.iso .cell .pin-chip,
  #map-canvas.iso .cell .pin-tail { display: none; }
  #map-canvas.iso .cell .pin-thumb {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.94); box-shadow: 0 2px 5px rgba(20,35,60,0.35);
    border: 2.5px solid rgba(255,255,255,0.9);
    /* 等距棋盘：图标挪到格子的**前角**（屏幕右下），把格子中间让给立牌棋子。
       原作参考图就是这个布置。挪太多会挂到格子外面（试过 11/23，悬在边上）。 */
    transform: translate(7px, 14px);
  }
  #map-canvas.iso .cell .pin-thumb .poi-img { border-radius: 50%; }
  #map-canvas.iso .cell .pin-thumb.plate { background: #3f3a55; border-color: var(--ring, #9bb4d4); }
  #map-canvas.iso .cell.badge .pin-thumb { width: 38px; height: 38px; }
  #map-canvas.iso .cell:hover .pin-chip { display: flex; position: absolute; bottom: 52px; }
  #map-canvas.iso ~ .watermark, #map-canvas.iso .watermark { display: none; }
  #map-canvas.iso .pdot { width: 8px; height: 8px; }

  /* ---------- 渲染底图模式（格子棋盘）----------
     底图是 Blender 渲染的那张 3D 图（art/board/board_iso.jpg），相机参数随 /state 下发。
     格子形式（金币/商店/事件…）已经烤在图里了 → 网页的图钉本体**不再画一遍**，
     .cell 只剩一小块"悬停/点击热区"和悬停牌；引擎状态里才有的东西（所有权色块、
     对勾、棋子、路线高亮）另画在上面那层 SVG 里。 */
  #map-bg { position: absolute; left: 0; top: 0; z-index: 0; -webkit-user-drag: none; user-select: none; }
  #map-canvas.render .cell {
    transform: translate(-50%, -50%); width: 78px; height: 46px; z-index: 5;
  }
  #map-canvas.render .cell .pin-thumb,
  #map-canvas.render .cell .pin-tail { display: none; }
  #map-canvas.render .cell .pin-chip { display: none; }
  #map-canvas.render .cell:hover .pin-chip {
    display: flex; position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
    pointer-events: none; z-index: 40;
  }
  #map-canvas.render .pdot { display: none; }
  /* ---------- three.js 渲染模式（格子棋盘 3D 版，2026-10-04）----------
     底图/格子/棋子/所有权全部在 WebGL 场景里；DOM 只留岔路箭头（#hint-svg，
     按投影逐帧摆位）和悬停牌。WebGL 不可用时回退上面的 DOM 渲染版。 */
  #map-canvas.gl3d { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  #gl-stage { position: absolute; inset: 0; }
  #gl-stage canvas { display: block; }
  #gl-hover { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 40; }
  #gl-hover .cell { position: static; width: auto; height: auto; }
  #gl-hover .cell .pin-chip { display: flex !important; }
  /* ---- 头顶现金小字（金币进账 / 交租双方 / 她买特殊骰子）：上浮淡出的金色数字 ---- */
  .cash-fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 60; }
  .cash-fx span {
    display: inline-block; transform: translate(-50%, -100%);
    font-size: 15px; font-weight: 800; color: #ffd76a; white-space: nowrap;
    text-shadow: 0 1px 0 #14161f, 0 0 7px rgba(0, 0, 0, 0.6);
    animation: cashRise 1.9s ease-out forwards;
  }
  .cash-fx.neg span { color: #ff96a6; }
  @keyframes cashRise {
    0% { opacity: 0; margin-top: 8px; }
    14% { opacity: 1; }
    68% { opacity: 1; }
    100% { opacity: 0; margin-top: -46px; }
  }
  #hint-svg .route-pick { pointer-events: auto; }
  /* 动态层容器（2026-09-30 结构复用）：格子/棋子每帧整体替换，底图 <img> 不再重挂。
     容器自己不接事件（不挡拖拽/缩放），格子的悬停牌各自打开事件。 */
  #cells-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  #cells-layer .cell, #cells-layer .pdot { pointer-events: auto; }
  #cells-layer .standee { pointer-events: none; }
  /* 棋子层（2026-10-01）：两个 <img> **常驻**，只改 src/left/top ——
     以前每次渲染都重建 <img>，换棋子/每回合都要重新解码立绘大图（切棋子卡顿的来源） */
  #pieces-layer { position: absolute; left: 0; top: 0; pointer-events: none; }

  /* 同格挡路：**触发时才弹**（用户 2026-09-23：「提示常驻会挡视野」）。
     以前只要这条规则开着就常驻一条，把棋盘左下角压掉一块；现在只在"刚发生挡路"时
     弹几秒就淡出。位置仍在左下角——顶上是操作条（自动模式/悔棋/重开），放上面会盖住按钮。 */
  #rule-hint {
    position: absolute; left: 14px; bottom: 46px; z-index: 13; max-width: 42%;
    background: rgba(30,38,58,0.90); color: #eaf0fa; border-radius: 12px;
    padding: 8px 12px 9px; font-size: 12px; line-height: 1.5;
    border-left: 3px solid var(--gold); box-shadow: 0 6px 18px rgba(20,32,56,0.28);
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .28s ease, transform .28s ease, visibility .28s;
    pointer-events: none;
  }
  #rule-hint.show { opacity: 1; visibility: visible; transform: none; pointer-events: auto; cursor: pointer; }
  #rule-hint b { color: var(--gold); margin-right: 6px; }
  #rule-hint .now { display: block; margin-top: 4px; color: #9fc6f0; }

  /* ---------- 塔内地图（踩到传送点进汉加米塔那一次的上行动画） ---------- */
  /* 塔内三层回廊 + 一枚正在往上走的棋子，逐层亮起来。踩到那座传送点时弹出，
     放完自己收（也能点"收起"或点背景关掉）。
     ⚠️ 别给这层加 backdrop-filter：底下压着整张棋盘，每帧重算整屏模糊是这台
     WebView 上最贵的操作（弹窗那次踩过），这里只用半透明底色。 */
  #tower-view {
    position: absolute; inset: 0; z-index: 18; display: flex;
    align-items: center; justify-content: center;
    background: rgba(16, 22, 36, 0.62); border-radius: 14px;
    opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s;
  }
  #tower-view.show { opacity: 1; visibility: visible; }
  .tower-card {
    width: min(520px, 94%); max-height: 96%; overflow: auto; border-radius: 18px;
    background: linear-gradient(170deg, #1b2740, #141d31 62%, #101827);
    border: 1px solid rgba(140, 175, 225, 0.28);
    box-shadow: 0 22px 60px rgba(4, 10, 22, 0.62);
    transform: translateY(10px) scale(.98); transition: transform .34s cubic-bezier(.2,.9,.3,1.2);
  }
  #tower-view.show .tower-card { transform: none; }
  .tower-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 16px 10px; border-bottom: 1px solid rgba(140, 175, 225, 0.18);
  }
  .tower-head .tn { font-size: 16px; font-weight: 800; letter-spacing: 3px; color: #ffd97a; }
  .tower-head .ts { font-size: 12px; color: #9fb4d4; flex: 1; }
  .tower-head button {
    border: 0; background: rgba(255, 255, 255, 0.10); color: #cfe0f6;
    font-size: 12px; padding: 5px 14px; border-radius: 999px; cursor: pointer;
  }
  .tower-head button:hover { background: rgba(255, 255, 255, 0.20); }
  #tower-stage { padding: 6px 10px 12px; }
  #tower-stage svg { display: block; width: 100%; height: auto; }
  /* 逐层亮起来：`on` = "已经走到这一层"（逐层用 setTimeout 加 —— 宿主 WebView 里 RAF 不触发） */
  .tw-floor { opacity: .20; transition: opacity .4s ease; }
  .tw-floor.on { opacity: 1; }
  .tw-info { opacity: 0; transition: opacity .45s ease .08s; }
  .tw-info.on { opacity: 1; }
  .tw-walker { opacity: 0; transition: opacity .3s ease; }
  .tw-walker.on { opacity: 1; }
  .tw-walker .bob { animation: twBob 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes twBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* 开局选棋子弹窗：四个立牌挑两个（玩家 / 夜乃樱） */
  .piece-pick { background: #fff; border-radius: 18px; padding: 20px 22px 18px;
    box-shadow: 0 18px 50px rgba(20,34,60,0.34); width: min(560px, 92vw); }
  .piece-pick h3 { margin: 0 0 2px; font-size: 17px; color: var(--ink); }
  .piece-pick .sub { font-size: 12px; color: var(--ink-dim); margin-bottom: 12px; }
  .piece-pick .who { font-size: 12px; font-weight: 800; color: var(--ink-dim); margin: 10px 0 6px; }
  .piece-pick .row { display: flex; gap: 10px; }
  .piece-pick button {
    flex: 1 1 0; padding: 6px 4px 5px; border-radius: 12px; cursor: pointer; font-family: inherit;
    background: #f7f9fd; border: 2px solid var(--panel-line); line-height: 0;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .piece-pick button img { width: 100%; max-width: 88px; height: 96px; object-fit: contain; }
  .piece-pick button .nm { font-size: 12px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .piece-pick button.on { background: #fff7e4; border-color: var(--gold); }
  .piece-pick button.taken { opacity: 0.45; }
  .piece-pick .foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .piece-pick .foot .sub { margin: 0; flex: 1; }

  .cell .pin-chip {                        /* 名称 + 价格的小牌，在图钉上方 */
    display: flex; align-items: center; gap: 4px; white-space: nowrap;
    background: rgba(255,255,255,0.97); border-radius: 8px; padding: 3px 8px 4px;
    font-size: 12.5px; font-weight: 700; color: var(--ink);
    box-shadow: 0 2px 6px rgba(45,75,125,0.26);
  }
  .cell .pin-chip .band { width: 4px; height: 13px; border-radius: 2px; background: #999; flex: none; }
  .cell .pin-chip .price { color: #c98a10; font-weight: 800; }
  .cell .pin-chip .sub { font-size: 11px; color: var(--ink-dim); font-weight: 700; }
  .cell .pin-chip .owner-tag {
    background: var(--blue-deep); color: #fff; border-radius: 999px;
    padding: 0 6px; font-size: 11px; font-weight: 700;
  }
  .cell .pin-thumb {                       /* 图钉本体 */
    position: relative; width: 62px; height: 62px; border-radius: 15px;
    background: #fff; border: 3px solid var(--ring, #9bb4d4);
    box-shadow: 0 4px 10px rgba(45,75,125,0.30);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .cell .pin-thumb svg.cell-icon { width: 40px; height: 40px; display: block; }
  /* 六种形式图标是从参考图抠出来的"深色地砖上的白色贴纸"，底子必须压深才看得见。
     地标插图（poi-img）铺满整个图钉，不需要这层，所以只在没插图时加 .plate。 */
  .cell .pin-thumb.plate { background: #3f3a55; }
  .cell .pin-thumb img.cell-icon {         /* 格子形式图标（art/icons/*.png，六种形式各一张） */
    width: 42px; height: 42px; display: block; object-fit: contain;
  }
  .cell .pin-thumb img.poi-img {           /* AI 地标插图（已裁掉白边，主体填满图钉） */
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center; border-radius: inherit;
  }
  .cell .pin-tail {                        /* 三角钉尖 */
    width: 0; height: 0; margin-top: -1px;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-top: 10px solid var(--ring, #9bb4d4);
    filter: drop-shadow(0 1px 1px rgba(45,75,125,0.3));
  }
  .cell.badge .pin-thumb { width: 38px; height: 38px; border-radius: 50%; }
  .cell.badge .pin-thumb svg.cell-icon { width: 27px; height: 27px; }
  .cell.badge .pin-thumb img.cell-icon { width: 28px; height: 28px; }
  .cell.badge .pin-tail { border-top-width: 9px; }
  .cell.start .pin-thumb {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(160deg, #fffaea, #fde9b8); border-color: var(--gold);
  }
  /* 起终点现在画的也是"白贴纸"箭头，所以同样压深底子；金色边框继续标它是起点/终点 */
  .cell.start .pin-thumb.plate { background: #3f3a55; }
  .cell.start .pin-thumb svg.cell-icon { width: 36px; height: 36px; }
  .cell.start .pin-thumb img.cell-icon { width: 38px; height: 38px; }
  .cell:hover .pin-thumb { border-color: var(--pink-deep); box-shadow: 0 6px 16px rgba(224,122,154,0.4); }
  .cell.owned .pin-chip { box-shadow: 0 0 0 2px rgba(240,180,41,0.55), 0 2px 6px rgba(45,75,125,0.26); }
  .cell.owned .pin-thumb { border-color: var(--gold); }
  .cell.mortgaged { opacity: 0.5; }
  .pdot {                                  /* 钉尖落点：路线上的锚点 */
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; border: 2.6px solid var(--ring, #9bb4d4);
    transform: translate(-50%, -50%); z-index: 2;
    box-shadow: 0 1px 3px rgba(45,75,125,0.35);
  }
  .pdot.start { border-color: var(--gold); background: #fff6dd; }

  /* ---------- 随机地图：圆圈 = 格子（参考手画路线图），线从圆里穿过 ---------- */
  #map-canvas.organic .cell .pin-thumb { border-radius: 50%; }
  #map-canvas.organic .cell .pin-tail { display: none; }
  #map-canvas.organic .cell .pin-chip { margin-bottom: 3px; }
  #map-canvas.organic .pdot { border-radius: 50%; }

  /* 侧栏选项（五子棋难度/棋风、地图来源）：一行一组，按钮之间有间距 */
  .opt-line { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
  .opt-label { flex: none; font-size: 12px; color: var(--ink-dim); }
  .opt-row { display: inline-flex; gap: 9px; flex-wrap: wrap; }
  .opt-btn {
    padding: 5px 14px; border-radius: 999px; border: 1px solid var(--panel-line);
    cursor: pointer; font-size: 12px; font-family: inherit; transition: background .15s ease;
  }
  #map-switch { padding: 6px 14px 10px; border-top: 1px dashed var(--panel-line); }
  /* ---------- 立牌棋子（等距格子棋盘专用）----------
     Q 版立绘直接"站"在格子上：translate(-50%,-100%) 让图片的底边中点落在锚点上，
     所以锚点＝她的脚下。参考图里图标在格子前角、棋子站在中间，所以下面那条
     `#map-canvas.iso .cell .pin-thumb` 把图标往格子的前角挪了一格多，
     立牌站在中间就不会盖住它。 */
  .standee {
    position: absolute; z-index: 7; pointer-events: none;
    transform: translate(-50%, -100%);
    transform-origin: bottom center;
    filter: drop-shadow(0 3px 5px rgba(28,42,70,0.38));
    transition: left .12s linear, top .12s linear;
  }
  .standee.active-turn { filter: drop-shadow(0 0 6px rgba(240,180,41,0.95)) drop-shadow(0 3px 5px rgba(28,42,70,0.38)); }
  /* 棋子：移动时沿路径逐格跳动 */
  /* ---------- 棋子头像：够大，缩放地图时会按比例放大，任何缩放下都看得见 ---------- */
  .token {
    position: absolute; width: 54px; height: 54px; border-radius: 50%;
    transform: translate(-50%, -50%); z-index: 6;
    border: 3px solid #fff; box-shadow: 0 4px 12px rgba(60,90,150,0.45);
    object-fit: cover; object-position: center;
    background: #dfe8f4;
    transition: left .12s linear, top .12s linear;
  }
  .token.sakura { border-color: var(--pink); }
  .token.user { border-color: var(--blue); }
  .token.active-turn {                       /* 当前行动方：一圈呼吸光晕 */
    box-shadow: 0 0 0 4px rgba(240,180,41,0.55), 0 4px 12px rgba(60,90,150,0.45);
    animation: turnpulse 1.6s ease-in-out infinite;
  }
  @keyframes turnpulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(240,180,41,0.55), 0 4px 12px rgba(60,90,150,0.45); }
    50% { box-shadow: 0 0 0 9px rgba(240,180,41,0.18), 0 4px 12px rgba(60,90,150,0.45); }
  }
  #move-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; overflow: visible; }
  /* 岔路选路：箭头气泡不再挂在棋子旁边（用户 2026-09-30：又短又肿还挡棋子），
     改成**悬在候选格正上方**的一支下指箭头——呼吸浮动 + 落点提示，点箭头即选。
     箭头在候选格上方 46px，棋子站在格子中央，两者天然错开。 */
  #hint-svg { position: absolute; left: 0; top: 0; z-index: 8; overflow: visible; }
  #hint-svg .route-pick { cursor: pointer; }
  #hint-svg .route-pick .pick-arrow {
    transform-box: fill-box; transform-origin: center bottom;
    animation: pickBounce 1.1s ease-in-out infinite;
  }
  @keyframes pickBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }
  #hint-svg .route-pick:hover .pick-arrow path { fill: #fdf3d9; }
  /* 本回合出发格：紫色虚线圈，缓慢自转——和金色实线圈（可走路线/落点）一眼分得开。
     圈下面是白描边（和地图上其它标记一样），压在棋子/插图上也能读清；
     它不可点击，所以不会抢金色选点圈的按下。
     自转靠 CSS 动画；万一宿主 WebView 不给动画，它也只是静静地待在原地。 */
  #hint-svg .turn-start { pointer-events: none; }
  #hint-svg .turn-start .ts-ring {
    transform-box: fill-box; transform-origin: center;
    animation: tsSpin 9s linear infinite;
  }
  @keyframes tsSpin { to { transform: rotate(360deg); } }

  /* 操作条：置于棋盘上方，点起来顺手 */
  #action-bar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 10;
    display: flex; gap: 10px; justify-content: center; align-items: center;
    padding: 12px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.0));
  }
  #action-bar button {
    border: none; border-radius: 999px; padding: 9px 22px; font-size: 14px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer; color: #fff; box-shadow: 0 4px 12px rgba(74,134,200,0.35);
    background: linear-gradient(120deg, var(--blue), var(--blue-deep)); transition: transform .15s, filter .15s;
  }
  #action-bar button:hover { transform: translateY(-2px); filter: brightness(1.06); }
  #action-bar button:disabled { filter: grayscale(0.6); opacity: 0.55; cursor: not-allowed; transform: none; }
  #action-bar button.pink { background: linear-gradient(120deg, var(--pink), var(--pink-deep)); box-shadow: 0 4px 12px rgba(224,122,154,0.35); }
  #action-bar button.gold { background: linear-gradient(120deg, #f6c85a, var(--gold)); box-shadow: 0 4px 12px rgba(240,180,41,0.35); }
  #action-bar button.ghost { background: rgba(255,255,255,0.9); color: var(--ink); box-shadow: 0 2px 8px rgba(90,120,180,0.2); }
  #action-bar .hint { font-size: 12px; color: var(--ink-dim); background: rgba(255,255,255,0.85);
    padding: 6px 12px; border-radius: 999px; }

  /* 五子棋：暖木色棋盘，白子深描边以保证对比 */
  #gomoku { display: flex; align-items: center; justify-content: center; gap: 26px; height: 100%; padding: 56px 0 40px; }
  #gomoku table { border-collapse: collapse; background: #e9d3ac;
    border: 6px solid #d8bd90; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; }
  #gomoku td { width: var(--gcell, 40px); height: var(--gcell, 40px);
    border: 1px solid rgba(146,113,66,0.35); position: relative; padding: 0; }
  #gomoku td.head { border: none; background: transparent; font-size: 10px; color: #8a6f45;
    text-align: center; cursor: default; font-weight: 700; }
  #gomoku td.playable:hover { background: rgba(224,122,154,0.22); }
  #gomoku td .stone { position: absolute; inset: 3px; border-radius: 50%; }
  #gomoku td .stone.user {
    background: radial-gradient(circle at 34% 28%, #ffffff, #e6edf7 60%, #c7d4e4);
    border: 1.5px solid #8fa2ba; box-shadow: 0 2px 4px rgba(80,60,30,.35);
  }
  #gomoku td .stone.sakura {
    background: radial-gradient(circle at 34% 28%, #7d869f, #39415c 55%, #232941);
    border: 1.5px solid #1c2135; box-shadow: 0 2px 4px rgba(80,60,30,.35);
  }
  #gomoku .legend { text-align: center; color: #8a6f45; font-size: 13px; font-weight: 700; }

  /* ---------- 侧栏 ---------- */
  #panel { width: 330px; flex: none; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 3px 12px rgba(90,120,180,0.10); }
  .card h3 { font-size: 11px; color: var(--ink-dim); letter-spacing: 3px; margin-bottom: 8px; font-weight: 700; }
  .player-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .player-row img, .player-row .avatar-fallback {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: center;
    border: 2.5px solid var(--panel-line); background: #dfe8f4; flex: none;
  }
  /* 对手头像（整张立绘是全身图）：只取上半身——对准头顶附近，
     否则圆形取景框卡在腰上，只有身子没有头（用户 2026-09-30）。 */
  .player-row.sakura img { object-position: 50% 12%; }
  .player-row .pinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .player-row .who { font-size: 15px; font-weight: 700; }
  .player-row .own { font-size: 11px; color: var(--ink-dim); line-height: 1.35; }
  .player-row .cash { margin-left: auto; font-size: 19px; color: var(--gold); font-weight: 800; }
  .ordinary-buffs { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .ordinary-buff { max-width:100%; font-size:11px; line-height:1.55; padding:3px 6px; border-radius:6px; background:#edf2ff; color:#465986; overflow-wrap:anywhere; }
  .ordinary-buff.empty { color:var(--ink-dim); background:transparent; padding-left:0; }
  body.black-train-active .ordinary-buffs { display:none !important; }
  .player-row.active .who::after { content: " · 行动中"; color: var(--pink-deep); font-size: 11px; font-weight: 500; }
  .player-row.winner .who::after { content: " · 获胜"; color: var(--gold); font-size: 11px; font-weight: 700; }

  #dice-card { display: flex; align-items: center; gap: 14px; min-height: 74px; }
  .die { width: 54px; height: 54px; border-radius: 12px; flex: none;
    background: linear-gradient(150deg, #ffffff, #e8effa);
    border: 1px solid var(--panel-line);
    box-shadow: 0 4px 12px rgba(90,120,180,0.25), inset 0 -3px 0 rgba(120,150,200,0.25);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 7px; }
  .die.rolling { animation: shake .7s ease; }
  @keyframes shake {
    0% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-16deg) scale(1.12); }
    45% { transform: rotate(14deg) scale(1.08); }
    70% { transform: rotate(-8deg) scale(1.04); }
    100% { transform: rotate(0) scale(1); }
  }
  .die .pip { border-radius: 50%; }
  .die .pip.on { background: linear-gradient(140deg, var(--pink-deep), var(--blue-deep)); box-shadow: inset 0 -1px 2px rgba(0,0,0,0.25); }
  #dice-info { font-size: 13px; color: var(--ink); line-height: 1.6; }
  #dice-info .who { font-weight: 700; }
  #dice-info .sub { color: var(--ink-dim); font-size: 11px; }

  .mini { font-size: 12px; color: var(--ink-dim); line-height: 1.8; }
  .mini .g { color: var(--gold); font-weight: 700; }
  #log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; scrollbar-width: thin; }
  #log > div { font-size: 12px; line-height: 1.55; color: var(--ink-dim); border-left: 3px solid var(--panel-line); padding-left: 9px; border-radius: 2px; }
  #log div.navi { color: var(--blue-deep); border-left-color: var(--blue); background: rgba(111,168,220,0.08); }
  #log div.warn { color: var(--danger); border-left-color: var(--danger); background: rgba(232,99,126,0.07); }
  #log div.win { color: var(--gold); border-left-color: var(--gold); background: rgba(240,180,41,0.10); }

  #log .action-record { flex-shrink:0; padding:10px; border:1px solid #ccdcef; border-left:4px solid var(--blue); border-radius:10px; background:#f4f8fe; color:var(--ink); font-size:13px; line-height:1.6; }
  #log .action-record.sakura { border-left-color:var(--pink); background:#fff5f8; }
  #log .record-head { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:6px; font-size:13px; font-weight:800; }
  #log .record-step { font-size:11px; color:var(--ink-dim); font-weight:500; }
  #log .cash-line { display:flex; justify-content:space-between; align-items:baseline; gap:6px; padding:3px 0; }
  #log .cash-change { font-size:16px; font-weight:900; font-variant-numeric:tabular-nums; }
  #log .money-plus { color:#137c53; } #log .money-minus { color:#bd3252; } #log .money-zero { color:#687990; font-size:12px; }
  #log .cash-balance { display:block; color:var(--ink-dim); font-size:10px; font-weight:400; }
  #log .record-effect { color:#7251a5; font-size:12px; font-weight:700; padding:3px 6px; margin-top:4px; background:#eee8fb; border-radius:5px; }
  #log .record-property { color:#8b580b; font-size:12px; font-weight:800; padding:5px 6px; margin-top:5px; background:#fff1cf; border-radius:5px; }
  #log .record-story { margin-top:6px; padding-top:5px; border-top:1px dashed #d6dfed; font-size:12px; white-space:pre-line; overflow-wrap:anywhere; }
  #log .turn-steps { margin-top:8px; }
  #log .turn-steps > summary { cursor:pointer; font-size:12px; font-weight:700; }
  #log .turn-substep { margin-top:8px; padding:8px 0; border-top:1px dashed #ccdcef; }
  #log .turn-substep .cash-change { font-size:13px; }
  #log .raw-log { flex-shrink:0; font-size:11px; color:var(--ink-dim); }
  #log .raw-log summary { cursor:pointer; padding:5px; } #log .raw-lines { white-space:pre-line; line-height:1.6; }

  /* 弹窗（事件卡/帮助/骰子）
     **这里绝对不要加 backdrop-filter**：它是全屏的，底下压着整张地图（57 个 will-change 图钉图层
     + 路网 SVG + 建筑体块），加模糊后滚动帮助、播骰子动画都要每帧重算整屏模糊——实测就是
     "滚玩法说明比投骰子还卡"的根源。用半透明底色压暗背景即可，观感几乎一样。 */
  /* ---------- 弹窗：掷骰/事件卡挪到画面边缘（用户 2026-09-30 定：
     居中会挡住棋子行进），商店/游戏/判定这几张要"盯着手看"的仍然居中 ---------- */
  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 50;
    background: rgba(74, 94, 132, 0.45); }
  .modal.show { display: grid; }
  /* 掷骰弹窗：左下角。棋子行动时镜头把棋子放在视口中心，角上必然是空的 */
  #dice-modal { place-items: end start; pointer-events: auto; }
  #dice-modal .e-card { pointer-events: auto; margin: 0 0 26px 26px; }
  /* 事件卡：与其他事件弹窗（商店/游戏/判定）一样**居中**（用户 2026-10-01：
     右上角和别的不统一）。掷骰弹窗仍留左下角——它出现时棋子正要出发。 */
  #card-modal { place-items: center; }
  .e-card { width: 350px; padding: 26px 26px 22px; border-radius: 20px;
    background: linear-gradient(165deg, #ffffff, #eef4fd 75%);
    border: 1px solid rgba(111,168,220,0.5); box-shadow: 0 0 60px rgba(111,168,220,0.4);
    animation: flip .55s ease; }
  @keyframes flip { 0% { transform: rotateY(90deg) scale(.85); opacity: 0; } 100% { transform: rotateY(0) scale(1); opacity: 1; } }
  .e-card .from { font-size: 11px; color: var(--blue-deep); letter-spacing: 3px; margin-bottom: 10px; font-weight: 700; }
  .e-card .title { font-size: 22px; color: var(--ink); margin-bottom: 12px; font-weight: 800; }
  .e-card .flavor { font-size: 13px; line-height: 1.9; color: var(--ink-dim); }
  .e-card.win { border-color: rgba(240,180,41,0.6); box-shadow: 0 0 60px rgba(240,180,41,0.4); }
  .e-card.win .from { color: var(--gold); }
  /* 商店 / 游戏格 / 骰子判定：居中弹窗（用户 2026-09-30 定：这三样要盯着手看，
     而且出现时棋子本来就不在走） */
  .e-card.shop-card { width: min(400px, 94vw); max-height:90vh; overflow-y:auto; }
  .e-card.shop-card .shop-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 14px; border: 1.5px solid rgba(111,168,220,0.4); border-radius: 14px;
    margin-top: 10px; cursor: pointer; background: rgba(111,168,220,0.06); transition: background .15s, transform .15s; }
  .e-card.shop-card .shop-row:hover { background: rgba(111,168,220,0.16); transform: translateX(3px); }
  .e-card.shop-card .shop-row .t { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .e-card.shop-card .shop-row .d { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; line-height: 1.55; }
  .e-card.shop-card .shop-row .price { font-size: 16px; font-weight: 800; color: var(--gold); flex: none; }
  .e-card.shop-card .shop-row.skip { justify-content: center; color: var(--ink-dim); font-weight: 700; }
  .e-card.shop-card .shop-row.disabled { opacity: 0.45; pointer-events: none; }
  .shop-pool { margin-top:12px; padding:10px; border:1px dashed #b5a0da; border-radius:12px; font-size:11.5px; line-height:1.7; }
  .shop-pool strong { display:block; color:#70509b; }
  .shop-pool .held { opacity:.55; text-decoration:line-through; }
  .e-card.item-draw { position:relative; border:2px solid #b893dc; background:linear-gradient(145deg,#fff5dc,#f4eaff); animation:item-reveal 1.1s ease both; }
  .e-card.item-draw::before { content:'✦ 道具盲盒 ✦'; position:absolute; inset:0; display:grid; place-items:center; border-radius:18px; background:linear-gradient(135deg,#735291,#be8eac); color:white; font-size:24px; font-weight:800; animation:item-back 1.1s steps(1,end) both; pointer-events:none; }
  .e-card.item-draw .title { color:#765099; }
  @keyframes item-reveal { 0% { transform:rotateY(0) scale(.88); } 42% { transform:rotateY(90deg) scale(1.03); } 43% { transform:rotateY(-90deg) scale(1.03); } 100% { transform:rotateY(0) scale(1); } }
  @keyframes item-back { 0% { opacity:1; } 43%,100% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .e-card.item-draw { animation:none; } .e-card.item-draw::before { display:none; } }
  /* 掷骰判定：一根"成功线"横在骰子下面，骰子停下来就知道过没过 */
  .check-bar { position: relative; width: 100%; height: 10px; border-radius: 999px;
    background: rgba(111,168,220,0.25); margin: 14px 0 4px; }
  .check-bar .zone { position: absolute; top: 0; bottom: 0; right: 0;
    background: rgba(126,226,168,0.5); border-radius: 999px; }
  .check-bar .needle { position: absolute; top: -7px; width: 4px; height: 24px; border-radius: 2px;
    background: var(--ink); transition: left .5s cubic-bezier(.2,.8,.3,1); }
  .check-verdict { font-size: 20px; font-weight: 800; margin-top: 10px; }
  .check-verdict.ok { color: #2e9e63; } .check-verdict.bad { color: #c8506b; }
  /* 骰子弹窗：居中大骰子 */
  .e-card.dice-pop { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .die.die-big { width: 96px; height: 96px; border-radius: 22px; padding: 16px; }
  .die.die-big .pip { width: 14px; height: 14px; }
  .die.die-big.rolling { animation: diceShake .45s ease; }
  @keyframes diceShake {
    0% { transform: rotate(0) scale(1); } 30% { transform: rotate(-14deg) scale(1.12); }
    60% { transform: rotate(10deg) scale(1.06); } 100% { transform: rotate(0) scale(1); }
  }

  #help-modal .help-box { width: min(760px, 92vw); max-height: 86vh; overflow-y: auto; padding: 24px 26px;
    border-radius: 20px; background: #fff; border: 1px solid var(--panel-line); box-shadow: var(--shadow);
    /* 滚动隔离：内容重绘只影响这个框，不牵连背后的地图；滚到底也不把滚动传给页面 */
    contain: content; overscroll-behavior: contain; }
  #help-modal h2 { font-size: 18px; color: var(--ink); margin-bottom: 12px; }
  #help-modal h4 { font-size: 13px; color: var(--blue-deep); margin: 16px 0 8px; letter-spacing: 2px; }
  #help-modal p, #help-modal li { font-size: 12.5px; color: var(--ink-dim); line-height: 1.8; }
  .legend-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .legend-grid .lg { display: flex; align-items: center; gap: 8px; width: 46%; font-size: 12px; color: var(--ink);
    background: rgba(111,168,220,0.07); border-radius: 10px; padding: 6px 10px; }
  /* 图例图标：PNG 一律 24px（用户 2026-09-30：图例里图标太大，还残留了旧 SVG——
     那是因为图例把"PNG + 兜底 SVG"两份都拼了进去，图例这里只放 PNG 一份）。
     .lg-turn：从等距参考图抠出来的图标躺在地砖平面上，立起来要顺时针转 90°
     才和棋盘上烤的图标同向（用户 2026-10-01）。 */
  .legend-grid .lg svg { width: 24px; height: 24px; flex: none; }
  .legend-grid .lg img { width: 24px; height: 24px; flex: none; object-fit: contain; }
  .legend-grid .lg img.lg-turn { transform: rotate(90deg); }
  .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cards-grid .cd { background: rgba(111,168,220,0.07); border-radius: 12px; padding: 10px 12px; }
  .cards-grid .cd .t { font-size: 13px; font-weight: 700; color: var(--ink); }
  .cards-grid .cd .e { font-size: 11px; color: var(--gold); font-weight: 700; margin: 2px 0 4px; }
  .cards-grid .cd .f { font-size: 11.5px; color: var(--ink-dim); line-height: 1.6; }

  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 60;
    background: rgba(58,65,92,0.92); color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
    display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }

  #connection-status { position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:100;
    display:flex; align-items:center; gap:14px; box-sizing:border-box; width:max-content; max-width:90vw;
    padding:12px 14px 12px 18px; border:1px solid #ead8bc; border-radius:16px; background:#fff8eb;
    color:#654827; box-shadow:0 6px 24px #49341524; font-size:13px; line-height:1.6; }
  #connection-status[hidden] { display:none; }
  #connection-status > span { min-width:0; }
  #connection-status button { display:inline-flex; align-items:center; justify-content:center; gap:7px;
    flex-shrink:0; min-height:40px; padding:8px 15px; margin:0; border:1px solid #cdb5e4;
    border-radius:999px; background:linear-gradient(135deg,#f4ecff,#e9dcf7); color:#594074;
    font:inherit; font-size:12px; font-weight:700; line-height:1.4; cursor:pointer;
    box-shadow:0 2px 5px #65428018; transition:background .15s,box-shadow .15s,transform .15s; }
  #connection-status button:hover:not(:disabled) { background:#e5d4f5; box-shadow:0 3px 9px #65428030; transform:translateY(-1px); }

async function api(action, args = {}) {
  const agent = state.agentUI;
  const cancelling = action === 'cancel_agent';
  // Cancellation revokes only the matching decision, not a played move or speech.
  // It must remain reachable even under a presentation/return lock.
  if (cancelling) {
    if (!agent || AgentUI.cancelId(agent) !== args.id) return {ok:false, agentLocked:true};
  } else {
    if (agent && (AgentUI.busy(agent) || (action === 'act_sakura' && agent.paused))
        && ['roll','decide','act_sakura','place','undo','start','black_train_start','tower_step','tower_finish'].includes(action)) {
      return {ok:false, agentLocked:true};
    }
    // Client presentation may outlive server active=false.
    if (!presentationSnapshot().allows('api', action)) return { ok:false, presentationLocked:true };
  }
  const tracked = action === 'act_sakura' || cancelling;
  const epoch = tracked ? uiEpoch : null, gameSeq = state.gameSeq;
  const ui = tracked ? (state.agentUI || (state.agentUI = AgentUI.create(gameSeq))) : agent;
  if (tracked) {
    ui[cancelling ? 'cancelling' : 'submitting'] = true;
    clearTimeout(autoTimer); autoTimer = null;
    if (state.game) renderActionBar(state.game, false);
  }
  let data;
  try {
    data = await connection.action(action, args);
    if (tracked && epoch === uiEpoch && gameSeq === state.gameSeq && state.agentUI === ui) {
      if (Object.hasOwn(data, 'agentDecision')) AgentUI.sync(ui, {gameSeq, decisionDriver:ui.driver, agentDecision:data.agentDecision});
      if (!data.ok) AgentUI.reject(ui, data.error);
    }
    if (!data.ok && (!tracked || (epoch === uiEpoch && gameSeq === state.gameSeq && state.agentUI === ui))) {
      toast(data.error || "操作失败", data.uncertain ? 7000 : 2600);
    }
    return data;
  } catch (error) {
    if (tracked && epoch === uiEpoch && gameSeq === state.gameSeq && state.agentUI === ui) AgentUI.reject(ui, error?.message);
    throw error;
  } finally {
    if (tracked && state.agentUI === ui && epoch === uiEpoch && gameSeq === state.gameSeq) {
      ui.submitting = ui.cancelling = false;
      // Successful commits are rendered only by poll, after movement/event holds
      // have been registered. Never schedule a new auto step from an old game.
      if ((AgentUI.busy(ui) || ui.paused) && state.game) renderActionBar(state.game, false);
    }
  }
}
function syncAgentSnapshot(data) {

  const actorColor = player === "user" ? "#3f8fd8" : "#e0506e";

  /* 塔身剖面：左半是塔内空间（一层一块等距圆盘，一层比一层高），右半逐层写这一层

  const RISE = 96;                                  // 每层抬多高

        height="${Math.max(2, yA - yB).toFixed(1)}" rx="2.5" fill="#41608c"/>`);
    }
    return `<g class="tw-floor f${i + 1}">${out.join("")}</g>`;
  }).join("");

  /* 每层右侧的说明：事件文本可能很长（整张事件卡的话都挤在这一行）——
     以前 slice(0,42) 硬截，后来按"字符数"折行又把行宽估大了（text 从 viewBox
     右边漏出去被卡片裁掉，2026-10-01 实测还是显示不全）。这次按**像素**算宽：
     CJK ≈ 字号 px、ASCII ≈ 0.56 字号，viewBox 也加宽到 560，一层最多 4 行，
     放不下的才以"…"收尾。 */
  const NOTE_X = 244;                 // textX（与下面的 infoG 保持一致）
  const NOTE_RIGHT = 552;             // 说明文字的右边界（viewBox 560 内留 8px 余量）
  const wrapNote = (note, pxWidth, fontSize) => {
    const chars = String(note || "").replace(/\s+/g, " ").trim().split("");
    const lines = [];
    let line = "", w = 0;
    for (const ch of chars) {
      const cw = ch.charCodeAt(0) > 255 ? fontSize : fontSize * 0.56;
      if (w + cw > pxWidth && line) { lines.push(line); line = ""; w = 0; }
      line += ch; w += cw;
      if (lines.length >= 4) break;
    }
    if (line && lines.length < 4) lines.push(line);
    if (!lines.length) lines.push("");
    if (chars.length > lines.join("").length) {
      lines[lines.length - 1] = lines[lines.length - 1].slice(0, Math.max(0, lines[lines.length - 1].length - 1)) + "…";
    }
    return lines;
  };
  const infoG = floors.map((f, i) => {
    const y = yOf(i);
    const amt = Number(f.amount) || 0;
    const amtTxt = amt > 0 ? `+¥${amt}` : (amt < 0 ? `−¥${Math.abs(amt)}` : "—");
    const amtColor = amt > 0 ? "#7ee2a8" : (amt < 0 ? "#ff9db0" : "#8ea6c8");
    const noteLines = wrapNote(f.resolved ? f.note : "抵达后触发", NOTE_RIGHT - NOTE_X, 11.5);
    const noteSvg = noteLines.map((ln, k) =>
      `<text class="${k===0?'tw-note':'tw-note-extra'}" x="${textX}" y="${y + 27 + k * 15}" font-size="11.5" fill="#9fb4d4">${esc(ln)}</text>`).join("");
    return `<g class="tw-info i${i}">
      <text x="${textX}" y="${y - 10}" font-size="13.5" font-weight="700"
        fill="#e8f1ff">第 ${f.floor} 层 · ${esc(f.floorName)}</text>
      <text x="${textX}" y="${y + 9}" font-size="13" font-weight="700"
        fill="${amtColor}">${esc(f.label)}　${amtTxt}</text>
      ${noteSvg}
    </g>`;
  }).join("");

  const card = `
    <div class="tower-head">
      <span class="tn">${esc(tower.name || "汉加米塔")}</span>
      <span class="ts">从「${esc(tower.entry || "")}」的传送门进入 · ${esc(tower.playerLabel || "")}</span>
      <button type="button" id="tower-close">收起</button>
    </div>
    <div id="tower-stage">
      <svg viewBox="0 0 560 ${viewH}" xmlns="http://www.w3.org/2000/svg">
        <rect x="${BOX.x - 16}" y="${wallTop}" width="${BOX.w + 32}"
          height="${wallBottom - wallTop}" rx="26" fill="rgba(11,18,32,0.55)"
          stroke="#7f97bb" stroke-width="3"/>
        <path d="M${BOX.x - 16},${wallTop + 40} Q${CX},${wallTop + 4} ${BOX.x + BOX.w + 16},${wallTop + 40}"
          fill="none" stroke="#e6c169" stroke-width="3" opacity="0.8"/>
        ${stepG}
        ${floorG}
        ${infoG}
        <g class="tw-walker" id="tower-walker">
          <circle class="bob" cx="${CX}" cy="${yOf(0) - 22}" r="20" fill="${actorColor}" opacity="0.20"/>
          <image class="bob" href="/art/chibi/${esc(key)}.png"
            x="${CX - 22}" y="${yOf(0) - 62}" width="44" height="58"
            preserveAspectRatio="xMidYMax meet"/>
        </g>
      </svg>
      <div style="display:flex;align-items:center;gap:12px;padding:2px 12px 4px">
        <button type="button" id="tower-climb"
          style="flex:1;border:0;border-radius:999px;padding:9px 0;font-size:13.5px;font-weight:800;
                 letter-spacing:2px;cursor:pointer;color:#1c2338;background:linear-gradient(120deg,#ffd97a,#f0b429)">
          向上爬 ⬆</button>
        <span id="tower-progress" style="font-size:11.5px;color:#9fb4d4;flex:none"></span>
      </div>
    </div>`;
  const view = document.createElement("div");
  view.id = "tower-view";view.dataset.seq=tower.seq;view._wrapNote=wrapNote;view._yOf=yOf;
  view.innerHTML = `<div class="tower-card">${card}</div>`;
  wrap.appendChild(view);
  // 下一拍再加 .show，让 opacity/transform 的过渡真的跑起来。
  // 用 setTimeout 而不是 requestAnimationFrame：宿主 WebView 里 RAF 会被节流（见 animateMove）
  setTimeout(() => view.classList.add("show"), 16);
  view.addEventListener("click", (e) => { if (e.target === view) closeTower(); });
  const btn = $("#tower-close");
  if (btn) btn.addEventListener("click", () => closeTower());
  clearTimeout(state.towerHideTimer);
  state.towerHideTimer = setTimeout(()=>{if(towerLocked())toast("塔内暂停中，可继续探索或临时收起");}, TOWER_TOTAL_MS);

  towerClimb={at:Math.max(0,tower.at),total:N};
  const walker=$("#tower-walker");if(walker){walker.classList.add('on');walker.style.transform=`translateY(${-Math.max(0,tower.at)*RISE}px)`;}
  updateTowerPanel(tower);
  if(tower.at<0){const generation=towerGeneration;const timer=setTimeout(()=>{if(generation===towerGeneration && $("#tower-view") && state.towerData.at<0)requestTower(false);},180);towerTimers.push(timer);}

}

/* 这一步走了哪条路：把路径画出来，棋子顺着线滑过去（不再一格一格跳） */
let moveTimers = [];
let moveRaf = 0;
function _anchor(node) {
  // 等距格子棋盘：格子钉在等距地砖的顶面中心（isoPos 由 renderMonopoly 铺好）
  if (mapState.iso && mapState.isoPos && mapState.isoPos.has(node.id)) return mapState.isoPos.get(node.id);
  const shift = mapState.anchorShift || 0;
  return [PX(node.x) + shift, PY(node.y) + shift];
}

/* 按格子 id 取"棋子应该站的屏幕坐标"：立牌钉在锚点，圆形头像走 tokenPos。
   渲染和"待出发压帧"共用这一份，别处不要再手算。 */
function pieceAnchor(player, cellId) {
  const cell = cellId != null && state.game && state.game.cells ? state.game.cells[cellId] : null;
  if (!cell) return null;
  return mapState.iso ? _anchor(cell).slice() : tokenPos(player, cell).slice();
}

function tokenPos(player, node) {
  const side = player === "user" ? -17 : 17;
  const extra = mapState.organic ? (player === "user" ? -12 : 12) : 0;
  const drop = mapState.organic ? 64 : 0;
  const a = _anchor(node);
  return [a[0] + side + extra, a[1] + drop - (mapState.iso ? 26 : 0)];
}
/* 本回合的出发格标记：紫色虚线圈 + 中心点。
   圈比棋子（54px）大一圈，所以它是"圈住棋子"而不是贴在棋子脸上；白描边垫底，
   跨过棋子/插图/深色地块时都读得清。金色粗线画的是"这个选择会走到哪"，
   紫色只负责回答"这一程是从哪出发的"。 */
function turnStartMark(node) {
  if (!node) return "";
  // ⚠️ 走 _anchor()：等距棋盘（含渲染底图）上格子钉在 isoPos，PX/PY 是另一套坐标
  const a = _anchor(node);
  const x = a[0].toFixed(1), y = a[1].toFixed(1);
  const r = mapState.render ? 22 : 32;
  return `<g class="turn-start">
    <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="6" opacity="0.85"/>
    <circle class="ts-ring" cx="${x}" cy="${y}" r="${r}" fill="none"
      style="stroke:var(--start)" stroke-width="3.2" stroke-dasharray="8 8"/>
    <circle cx="${x}" cy="${y}" r="4.5" style="fill:var(--start)" stroke="#fff" stroke-width="2"/></g>`;
}

/* 棋子移动动画（用户 2026-09-30 重写）：
   · 不再画"路径线"（用户：取消角色行动时的路径显示）——只留本回合出发格的紫圈；
   · 棋子**一格一格跳**：每格一个抛物线小跳（起跳-腾空-落地），比贴地滑行慢、更有"跳格子"感；
   · 跨传送门的那一跳不是跳，是"缩进去→在对面长出来"的动效（终点回起点不再闪现得突兀）；
   · 一律 setTimeout(33ms) 步进（宿主 WebView 里 RAF 不触发，见下）；时间基准 performance.now()。
   动画期间棋子用 transform 摆位（不走 left/top）—— left/top 每帧都触发布局重排，
   这正是走格子卡顿的大头；transform 走合成层，代价小得多。 */
const HOP_MS = 430;            // 每跳一格的时长（原来整段滑行 300+190n，现在每格 430ms）
const HOP_HEIGHT = 34;         // 跳起的高度（px）
const PORTAL_OUT_MS = 430;     // 传送门里"缩进去"的时长
const PORTAL_IN_MS = 460;      // 对面"长出来"的时长

/* ---- 落格才放行（2026-10-05，三种地图都有）----
   引擎状态是"结算后"的：事件窗内容 / 归属上色在掷骰阶段就已经躺在 /state 里，
   棋子没走到就弹窗、上色 = "人还没到、事情先发生"。规矩：
   · 移动开始（含被骰子弹窗压成 pendingMove 时）记 state.arrivalHold = 终点格 id；
   · 三处的上色（3D 徽章 / iso 归属图标 / .cell.owned 类）对 hold 格一律跳过；
   · landing/diceCheck 弹窗先存 held*，动画收尾 endMoveHold() 再放行。 */
function endMoveHold() {
  state.visualMovePending = null;
  state.arrivalHold = null;
  const l = state.heldLanding, c = state.heldCheck, s = state.heldShop;
  const cards = state.heldCards || [], fx = state.heldFx;
  state.heldLanding = state.heldCheck = state.heldShop = state.heldCards = state.heldFx = null;
  if (l) showGameLanding(l);
  if (c) showCheck(c);
  if (s) showShop(s);
  if (fx) showCashFx(fx);
  for (const card of cards) showCard(...card);
  render();syncTowerUI();                                  // 立刻把"落格上色"画出来，别等下一拍轮询
}

/* ---- 头顶现金小字（2026-10-05）：金币进账 / 交租双方各一条 / 她买特殊骰子 ----
   3D 里挂 overlay 跟着棋子（落格处头顶 1.5 格），DOM 图里钉在棋子元素当前位置；
   数字上浮淡出 1.9s 后移除。 */
function showCashFx(items) {
  for (const it of (items || [])) {
    const el = document.createElement("div");
    el.className = "cash-fx" + (it.text.startsWith("-") ? " neg" : "");
    el.appendChild(document.createElement("span")).textContent = it.text;
    if (mapState.use3D && mapState.board3d && !mapState.board3d.dead) {
      const b3 = mapState.board3d;
      const host = $("#gl-stage");
      if (!host) continue;
      host.appendChild(el);
      b3.addOverlay(el, () => {
        const pos = b3.getPiecePosition && b3.getPiecePosition(it.player);
        if (pos) return { u: pos.u, v: pos.v, h: pos.h + 1.4 };
        const rec = state.pieceCell && state.pieceCell[it.player];
        const id = rec ? rec.cell : (state.game && state.game.positions[it.player]);
        const c = state.game && state.game.cells[id];
        return c ? { u: c.x, v: c.y, h: (c.h || 0) + 1.45 } : null;
      });
      setTimeout(() => { b3.removeOverlay(el); el.remove(); }, 2000);
    } else {
      const host = $("#map-canvas");
      const pieceEl = boardWrap.querySelector(
        `.standee[data-player="${it.player}"], .token[data-player="${it.player}"]`);
      if (!host || !pieceEl) continue;
      host.appendChild(el);
      el.style.left = pieceEl.style.left;
      el.style.top = (parseFloat(pieceEl.style.top) - 78) + "px";
      setTimeout(() => el.remove(), 2000);
    }
  }
}

function isGateHop(a, b) {
  const gates = state.gates || [];
  return gates.some(g => (g[0] === a && g[1] === b) || (g[0] === b && g[1] === a));
}

function animateMove(ev) {
  const game = state.game;
  // Invalid/stale input must not cancel another move or release its arrival hold.
  if (!game || !game.cells || !ev || !ev.player || !Array.isArray(ev.path)
      || !ev.path.length || !ev.path.every(id => game.cells[id])) return;
  moveTimers.forEach(clearTimeout);
  moveTimers = [];
  cancelAnimationFrame(moveRaf);
  /* 岔路续走（2026-10-05，三种地图都有）：选路之后的移动事件带的是**全程路径**，
     而棋子已经站在分岔点上 —— 不截断它就会闪回回合起点把走过的路重放一遍。
     截断判据必须带 version：岔路续走是"走到分岔"的下一个动作（version 差 ≤1）；
     差得远就是新一回合恰好路过同一格，绝不能截（会凭空瞬移跳格）。 */
  state.pieceCell = state.pieceCell || {};
  const rec = state.pieceCell[ev.player];
  const pathIds = ev.path.slice();
  if (rec && state.version - rec.ver <= 1) {
    const at = pathIds.indexOf(rec.cell);
    if (at > 0) pathIds.splice(0, at);
  }
  const nodes = pathIds.map(id => game.cells[id]).filter(Boolean);
  // A blocked roll (or a resumed path already at its end) still has to settle.
  if (nodes.length < 2) {
    state.pieceCell[ev.player] = { cell: nodes[0].id, ver: state.version };
    state.moveAnim = null;
    endMoveHold();
    return;
  }
  const player = ev.player;
  state.pieceCell[player] = { cell: nodes[0].id, ver: state.version };
  /* three.js 分支：棋子在 3D 场景里走（逐格小跳 + 传送门缩入/长出，节奏与 DOM 版一致）。
     state.moveAnim 只当"动画中"标记用 —— 渲染同步看到它就不再扳动这只棋子。 */
  if (mapState.use3D && mapState.board3d && !mapState.board3d.dead) {
    const pts = nodes.map(n => ({ u: n.x, v: n.y, h: n.h || 0 }));
    const gates = [];
    for (let i = 0; i < nodes.length - 1; i++) gates.push(isGateHop(nodes[i].id, nodes[i + 1].id));
    state.moveAnim = { player };
    const arrive = () => {
      if (state.moveAnim && state.moveAnim.player === player) state.moveAnim = null;
      state.pieceCell[player] = { cell: pathIds[pathIds.length - 1], ver: state.version };
      endMoveHold();
    };
    try {
      mapState.board3d.playMove(player, pts, gates, arrive,
        (i) => { state.pieceCell[player] = { cell: nodes[i].id, ver: state.version }; });
    } catch (e) {
      console.warn("3D 走格失败，直接落位：", e);
      arrive();
    }
    return;
  }
  mapState.follow=true;  // 新的走格恢复跟随；途中再次拖动仍可接管。
  const offset = mapState.iso ? 0
    : (player === "user" ? -17 : 17) + (mapState.organic ? (player === "user" ? -12 : 12) : 0);
  // 那个 64px 的"下沉"只属于随机图的圆形头像（tokenPos 里也有同一笔）——
  // 等距棋盘的立牌脚就钉在锚点上，不能加，否则走完会"沉一格"再被渲染拽回来（2026-09-30）
  const drop = mapState.iso ? 0 : (mapState.organic ? 64 : 0);
  const pts = nodes.map(n => _anchor(n));
  const layer = boardWrap.querySelector("#move-svg");
  if (layer) {
    layer.style.transition = "none";
    layer.style.opacity = "1";
    // 只画"这一程从哪出发"的紫圈；路径线按用户要求撤掉了
    layer.innerHTML = turnStartMark(nodes[0]);
  }
  // 动画状态：渲染周期随时重建棋子元素，这里记"当前画到哪"，render() 用它摆棋子
  state.moveAnim = { player, offset, drop,
    current: pts.length ? [pts[0][0] + offset, pts[0][1] + drop] : [0, 0] };
  // 上一段动画若是被半路接管的（比如传送门收缩到一半来了新的移动事件），
  // 棋子的 opacity 可能停在淡出的半途 —— 新动画开始时先拉回来
  const startEl = boardWrap.querySelector(
    `.token[data-player="${player}"], .standee[data-player="${player}"]`);
  if (startEl) { startEl.style.opacity = ""; startEl._moving = false; }
  const standee = mapState.iso;      // 立牌棋子用 transform 摆位；圆形头像仍用 left/top
  let hop = 0;

  const depthScale = (x, y) => {
    const vp = $("#map-viewport");
    if (!vp) return { s: 1, z: 5 };
    const rect = mapState.viewport;
    const cx = rect.width / 2, cy = rect.height / 2;
    const maxD = Math.hypot(rect.width, rect.height) / 2 || 1;
    const sx = x * mapState.zoom + mapState.ox;
    const sy = y * mapState.zoom + mapState.oy;
    const d = Math.min(1, Math.hypot(sx - cx, sy - cy) / maxD);
    return { s: 1.16 - d * 0.40, z: 4 + Math.round((1 - d) * 4) };
  };
  const place = (el, x, y, extra) => {
    state.moveAnim.current = [x + offset, y + drop];
    if (!el) return;
    el.style.transition = "none";
    el._moving = true;
    const dep = depthScale(x, y);
    /* ⚠️ 定位只走 left/top（绝对坐标），transform 只管"中心对齐 + 景深缩放"——
       两套各管各的。上一版把绝对坐标塞进 transform、又留着 left/top 不动，
       两个绝对定位叠加 = 棋子被平移出视口（"移动时看不见棋子"），
       走完一停 transform 恢复成居中、left/top 停在最后一帧 → 落点错位半格（2026-09-30）。 */
    if (standee) {
      el.style.left = (x + offset) + "px";
      el.style.top = (y + drop + (extra || 0)) + "px";
      el.style.transform = `translate(-50%,-100%) scale(${dep.s.toFixed(3)})`;
      el.style.zIndex = String(dep.z);
    } else {
      const ts = Math.min(2.5, Math.max(1.15, 1.15 / Math.max(0.45, mapState.zoom)));
      el.style.left = (x + offset) + "px";
      el.style.top = (y + drop + (extra || 0)) + "px";
      el.style.transform = `translate(-50%,-50%) scale(${ts.toFixed(3)})`;
    }
  };
  // 镜头跟随：把棋子平滑移向视口中心（用户缩放保留，只动平移）
  const follow = (x, y) => {
    const vp = $("#map-viewport");
    if (!vp) return;
    if(!mapState.follow)return;
    const rect = mapState.viewport;
    const targetOx = rect.width / 2 - (x + offset) * mapState.zoom;
    const targetOy = rect.height / 2 - (y + drop) * mapState.zoom;
    mapState.ox += (targetOx - mapState.ox) * 0.12;
    mapState.oy += (targetOy - mapState.oy) * 0.12;
    applyTransform();
  };
  const elOf = () => boardWrap.querySelector(
    `.token[data-player="${player}"], .standee[data-player="${player}"]`);

  /* 跳一格：k∈[0,1]，x/y 线性插值 + 抛物线高度（sin 半周期），落地那一下轻微压扁 */
  const runHop = (a, b, done) => {
    const t0 = performance.now();
    const step = () => {
      if (!state.moveAnim || state.moveAnim.player !== player) return;
      const k = Math.min(1, (performance.now() - t0) / HOP_MS);
      const x = a[0] + (b[0] - a[0]) * k;
      const y = a[1] + (b[1] - a[1]) * k;
      const lift = -Math.sin(Math.PI * k) * HOP_HEIGHT;
      place(elOf(), x, y, lift);
      follow(x, y);
      if (k < 1) { moveTimers.push(setTimeout(step, 16)); return; }
      done();
    };
    step();
  };
  /* 传传送门：先在门这一格"缩进去"（缩小+旋转+淡出），再在对面"长出来"（从小放大+淡入），
     门上补一圈青色扩散环。引擎的 path 里门就是一步（30→0），所以棋子不会瞬移。 */
  const runPortal = (a, b, done) => {
    const t0 = performance.now();
    if (layer) {
      const p = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      p.setAttribute("cx", a[0]); p.setAttribute("cy", a[1]);
      p.setAttribute("rx", 14); p.setAttribute("ry", 7);
      p.setAttribute("fill", "none"); p.setAttribute("stroke", "#7fd8ee");
      p.setAttribute("stroke-width", 4); p.setAttribute("opacity", "0.9");
      layer.appendChild(p);
      let tick = 0;
      const pulse = () => {
        tick += 1;
        p.setAttribute("rx", String(14 + tick * 9));
        p.setAttribute("ry", String(7 + tick * 4.5));
        p.setAttribute("opacity", String(Math.max(0, 0.9 - tick * 0.08)));
        if (tick < 12) moveTimers.push(setTimeout(pulse, 33));
        else p.remove();
      };
      pulse();
    }
    const shrink = () => {
      const tA = performance.now();
      const stepA = () => {
        if (!state.moveAnim || state.moveAnim.player !== player) return;
        const k = Math.min(1, (performance.now() - tA) / PORTAL_OUT_MS);
        const el = elOf();
        if (el) {
          const dep = depthScale(a[0], a[1]);

/* 对局记录里事件卡那一行的前缀由主题决定（默认 "NAVI通知"，港区是 "指挥部通报"）。 */
function naviLogPrefix() { return (state.theme && state.theme.naviLog) || "NAVI通知"; }

function actionRecordHTML(row, heading) {
  const money=n=>n>0?`+¥${n}`:n<0?`−¥${Math.abs(n)}`:'¥0 · 无变化';
  const seat=p=>NAMES[p]||p||'无主';
  const effectLabels={salary_next:'下次工资翻倍',rent_free:'免租一次',dice_bonus:'下次骰子加点',skip_pending:'罚停一回合',pick_dice:'特殊骰子',buff:'现金倍率',buff_left:'倍率剩余回合',rent_shield:'租金护盾',upgrade_coupon:'装修券',adventure_left:'冒险契约剩余本人行动',lucky_charm:'判定幸运签'};
  const value=(key,v)=>key==='buff'?({gain:'收入 ×2',loss:'支出 ×0.5',loss_up:'支出 ×1.5'}[v]||'无'):typeof v==='boolean'?(v?'持有':'无'):v==null?'无':String(v);
  const cash=[],effects=[];
  for(const p of ['user','sakura']){
    const info=(row.players||{})[p]||{},c=info.cash||{before:0,after:0,delta:0};
    cash.push(`<div class="cash-line"><span>${esc(seat(p))}</span><span class="cash-change ${c.delta>0?'money-plus':c.delta<0?'money-minus':'money-zero'}">${money(c.delta)}<small class="cash-balance">¥${c.before} → ¥${c.after}</small></span></div>`);
    for(const kind of ['effects','inventory'])for(const [key,v]of Object.entries(info[kind]?.changed||{}))effects.push(`<div class="record-effect">${esc(seat(p))} · ${esc(effectLabels[key]||key)}：${esc(value(key,v.before))} → ${esc(value(key,v.after))}</div>`);
  }
  const props=(row.properties||[]).map(p=>{
    const changes=[];
    if(p.changed?.owner)changes.push(`归属 ${seat(p.before.owner)} → ${seat(p.after.owner)}`);
    if(p.changed?.level)changes.push(`等级 ${p.before.level} → ${p.after.level}`);
    if(p.changed?.mortgaged)changes.push(p.after.mortgaged?'已抵押':'已赎回');
    return `<div class="record-property">房产 · ${esc(p.name)}<br>${esc(changes.join('；'))}</div>`;
  }).join('');
  return `<div class="record-head"><span class="record-step">${esc(heading||`步骤 #${row.id}`)}</span><span>${esc(seat(row.actor))} · ${esc(row.description||row.action)}</span>${row.source==='auto'?'<small class="record-step">自动</small>':''}</div>${cash.join('')}${effects.join('')|| (heading?'<div class="record-step">效果 / 道具：净无变化</div>':'')}${props|| (heading?'<div class="record-step">房产：净无变化</div>':'')}${row.story?.length?`<div class="record-story">${esc(row.story.join('\n'))}</div>`:''}`;
}
// 汇总只取每项的首个 before / 最后 after；逐步原始结算始终完整保留。
function actionTurnGroups(rows) {
  const groups=[];let current=null,legacyTurn=0;
  for(const row of rows){
    if(row.action==='roll'||!current|| (row.turn!=null&&row.turn!==current.turn)||row.actor!==current.actor){
      const turn=row.turn??++legacyTurn;
      current={turn,actor:row.actor,rows:[],partial:row.action!=='roll',key:`${turn}:${row.actor}:${row.id}`};groups.push(current);
    }
    current.rows.push(row);
  }
  return groups;
}
function actionTurnSummary(group) {
  const first=group.rows[0],last=group.rows[group.rows.length-1],players={},properties=new Map();
  const changed=(a,b)=>Object.fromEntries([...new Set([...Object.keys(a||{}),...Object.keys(b||{})])].filter(k=>JSON.stringify(a?.[k])!==JSON.stringify(b?.[k])).map(k=>[k,{before:a?.[k],after:b?.[k]}]));
  for(const p of ['user','sakura']){
    const old=first.players?.[p]||{},now=last.players?.[p]||{};
    players[p]={cash:{before:old.cash?.before||0,after:now.cash?.after||0,delta:group.rows.reduce((sum,r)=>sum+(r.players?.[p]?.cash?.delta||0),0)}};
    for(const kind of ['effects','inventory']){const before=old[kind]?.before||{},after=now[kind]?.after||{};players[p][kind]={before,after,changed:changed(before,after)};}
  }
  for(const row of group.rows)for(const prop of row.properties||[]){const old=properties.get(prop.cell);properties.set(prop.cell,{...prop,before:old?old.before:prop.before});}
  const props=[...properties.values()].map(p=>({...p,changed:changed(p.before,p.after)})).filter(p=>Object.keys(p.changed).length);
  return {actor:group.actor,players,properties:props,description:group.partial?'保留步骤净变化':last.turn_complete?'回合总净变化 · 已结束':'回合累计净变化 · 进行中'};
}
function renderActionLog() {
  const log=$('#log'),rows=state.actionRecords||[],signature=JSON.stringify([rows,state.log,NAMES.sakura]);
  if(log._signature===signature)return;log._signature=signature;
  const stick=log.scrollHeight-log.scrollTop-log.clientHeight<45;
  if(log._view!=='structured'){log.replaceChildren();log._view='structured';log._records=new Map();log._raw=document.createElement('details');log._raw.className='raw-log';log._raw.innerHTML='<summary>系统与策略记录</summary><div class="raw-lines"></div>';log.prepend(log._raw);}
  log._raw.querySelector('.raw-lines').textContent=(state.log||[]).join('\n');
  const groups=actionTurnGroups(rows),wanted=new Set(groups.map(g=>g.key));for(const[id,el]of log._records)if(!wanted.has(id)){el.remove();log._records.delete(id);}
  for(const group of groups){const key=JSON.stringify([group,NAMES.sakura]);let el=log._records.get(group.key);if(!el){el=document.createElement('div');el.className='action-record '+group.actor;el.dataset.turn=group.turn;log._records.set(group.key,el);log.appendChild(el);}if(el._key!==key){const open=el.querySelector('.turn-steps')?.open??false;el.innerHTML=actionRecordHTML(actionTurnSummary(group),`第 ${group.turn} 回合`)+`<details class="turn-steps" ${open?'open':''}><summary>${group.rows.length} 个子步骤 · 原始结算</summary>${group.rows.map((r,i)=>`<div class="turn-substep">${actionRecordHTML(r,`子步骤 ${i+1} · 动作 #${r.id}`)}</div>`).join('')}</details>`;el._key=key;}log.appendChild(el);}
  if(!rows.length)log._raw.open=true;else if(!log._hadRecords){log._raw.open=false;log._hadRecords=true;}
  if(stick)log.scrollTop=log.scrollHeight;
}
function appendLog(lines) {  const log = $("#log");
  if(Array.isArray(state.actionRecords)){renderActionLog();return;}
  if(log._view==='structured'){log.replaceChildren();log._view='legacy';log._signature=null;lines=state.log||lines;}
  const navi = naviLogPrefix();
  for (const line of lines) {
    const div = document.createElement("div");
    if (line.startsWith(navi)) div.className = "navi";
    else if (/破产|强制|伏击|怪獣|黑列车|塞壬/.test(line)) div.className = "warn";
    else if (/获胜/.test(line)) div.className = "win";
    div.textContent = line;
    log.appendChild(div);
  }
  log.scrollTop = log.scrollHeight;
}

// Only the authoritative event sequence triggers a reveal (never logs or inferred flags).
function consumeItemDraw(info, moveIncoming = false) {
  if (!info || !Number.isFinite(info.seq) || info.seq <= state.itemDrawSeq) return;
  state.itemDrawSeq = info.seq;
  if (!state.pollCount) return; // Initial load aligns the cursor without replaying history.

  else showCard(...card);
}

const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
function drawDie(value) {
  const die = $("#die");
  die.innerHTML = Array.from({ length: 9 }, (_, i) =>
    `<span class="pip ${PIPS[Math.min(6, value)].includes(i + 1) ? "on" : ""}"></span>`).join("");
}
function showDice(ev) {
  // 居中→左下角弹窗 + 大骰子轮换 8 帧随机面后落定真实点数。
  // 用户 2026-09-30：**弹窗点掉之前棋子不许出发** —— 移动事件先存进 state.pendingMove，
  // startPendingMove() 在弹窗关闭时才放行（自己的回合点掉才走；她的回合/自动模式下
  // 稍候自动收掉，免得"她自动走"被一个没人点的弹窗卡死）。
  const modal = $("#dice-modal");
  const big = $("#big-die");
  const generation = stopDieAnimation(big);
  modal.classList.add("show");
  // 转面时长按"过了多久"算（≥810ms 就落定），不按转了几帧 —— 定时器被节流时
  // 帧数会拖很久，按帧数算落定时间就不确定了
  const settleAt = performance.now() + 810;
  big._spin = setInterval(() => {
    if (generation !== big._modalGeneration) return;
    if (performance.now() >= settleAt) {
      clearInterval(big._spin);
      big._spin = null;
      drawDieAt(big, ev.dice);
      big.classList.remove("rolling");
      void big.offsetWidth;
      big.classList.add("rolling");
      $("#dice-pop-text").innerHTML =
        `<span class="who">${NAMES[ev.player] || ev.player}</span> 掷出了 <b style="color:var(--pink-deep)">${ev.dice}</b> 点`;
    } else {
      drawDieAt(big, 1 + Math.floor(Math.random() * 6));
    }
  }, 70);
  // 侧栏的小骰子卡同步显示最终点数
  drawDieAt($("#die"), ev.dice);
  $("#dice-info").innerHTML =
    `<span class="who">${NAMES[ev.player] || ev.player}</span> 掷出了 <b style="color:var(--pink-deep)">${ev.dice}</b> 点<br>` +
    `<span class="sub">${ev.dice >= 5 ? "好点子！" : ev.dice <= 2 ? "骰子大概睡着了。" : "中规中矩的一掷。"}</span>`;
  // 自动收起：她的回合（以及自动模式开着的时候）不等点击；玩家自己的回合必须点掉。
  // 落定 700ms + 结果停留，自动收 2400ms —— 上次 1150ms 连点数都看不清（2026-09-30 反馈）
  const autoplay = ev.player !== "user" || (state.autoMode || "off") === "hers";
  clearTimeout(state.diceAutoTimer);
  if (autoplay) state.diceAutoTimer = setTimeout(() => {
    if (generation !== big._modalGeneration || !modal.classList.contains("show")) return;
    closeResultModal("#dice-modal", "#big-die");
    startPendingMove();
  }, 2400);
}

      return;
    }
    clearInterval(die._spin);
    die._spin = null;
    drawDieAt(die, info.roll);
    die.classList.remove("rolling");
    void die.offsetWidth;
    die.classList.add("rolling");
    die._resultTimer = setTimeout(() => {
      if (generation !== die._modalGeneration) return;
      die._resultTimer = null;
      const v = $("#game-verdict");
      const reroll = Array.isArray(info.rolls) && info.rolls.length > 1
        ? `幸运签：首次 ${info.rolls[0]} 点失败 → 重判 ${info.rolls[info.rolls.length - 1]} 点；` : '';
      v.textContent = reroll + (info.won ? `${who} 掷出 ${info.roll} 点 —— 过关！` : `${who} 掷出 ${info.roll} 点 —— 没能过关`);
      v.style.color = info.won ? "#2e9e63" : "#c8506b";
      $("#game-note").textContent = info.reward || (info.won ? "" : "记成日常一幕，什么也没发生。");
    }, 420);
  }, 90);
}

function drawDieAt(die, value) {
  die.innerHTML = Array.from({ length: 9 }, (_, i) =>
    `<span class="pip ${PIPS[Math.min(6, value)].includes(i + 1) ? "on" : ""}"></span>`).join("");
}

/* 骰子卡内容：大富翁=最近一次移动骰，五子棋=开局先后手骰 */
function renderDiceCard(game) {
  const info = $("#dice-info");

/* ---------- 页签 ---------- */
function tabSwitchLocked() {
  return !presentationSnapshot().allows('tab');
}
function buildTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  for (const kind of ["monopoly", "gomoku"]) {
    const btn = document.createElement("button");
    btn.dataset.gameKind = kind;
    btn.textContent = GAMES[kind];
    if (state.game && state.game.kind === kind) {
      btn.innerHTML = GAMES[kind] + `<span class="live-dot"></span>`;
    }
    if (currentKind() === kind) btn.classList.add("on");
    // Keep the handler live: a modal can close without rebuilding these tabs.
    // aria-disabled describes the current lock; the fresh guard enforces it.
    const locked = kind !== currentKind() && tabSwitchLocked();
    btn.setAttribute('aria-disabled', String(locked));
    if (locked) btn.title = '请等待移动、弹窗与场景切换完成';
    btn.onclick = () => {
      if (kind === currentKind() || tabSwitchLocked()) return;
      state.tab = kind; render();
    };
    tabs.appendChild(btn);
  }
  const help = document.createElement("button");
  help.className = "help-btn";
  help.textContent = "玩法说明";
  help.onclick = openHelp;
  tabs.appendChild(help);
}
// Update local lock metadata without rebuilding tabs (or losing keyboard focus).
function syncTabLocks() {
  const kind = currentKind(), locked = tabSwitchLocked();
  document.querySelectorAll('#tabs [data-game-kind]').forEach(btn => {
    const blocked = btn.dataset.gameKind !== kind && locked;
    btn.setAttribute('aria-disabled', String(blocked));
    btn.title = blocked ? '请等待移动、弹窗与场景切换完成' : '';
  });
}
function currentKind() {
  if (BlackTrainView.active(state.game) || BlackTrainView.presentationActive(document) || BlackTrainView.inputLocked(document)) return 'monopoly';
  return state.tab || (state.game ? state.game.kind : null) || "monopoly";
}

function ordinaryPresentationPending() {
  showNextCard();
  return !presentationSnapshot().allows('entry');
}
function syncBlackTrainUI() {
  BlackTrainView.sync({ game: state.game, gameKey: state.gameSeq, names: NAMES, document, board: boardWrap, board3d: mapState.board3d,
    mapReady: !mapState.glMounting && (!mapState.use3D || !!mapState.board3d),
    deferEntry: ordinaryPresentationPending,
    deferEvents: () => boardMoveHeld() || $("#dice-modal").classList.contains("show") || $("#card-modal").classList.contains("show"),
    onChange: render, send: async (action, payload) => { await api(action, payload); await poll(); } });
}
function render() {
  // Ingest terminal history before ordinary action bars/automatic turns can run.
  syncBlackTrainUI();
  buildTabs();
  renderMapSwitch();
  const kind = currentKind();
  const live = state.game && state.game.kind === kind;

   选择会存进插件设置，下一局直接沿用（弹窗里预选的就是上一局的选择）。 */
let piecePick = { user: null, sakura: null };

function pickPiece(player, key) {
  const other = player === "user" ? "sakura" : "user";
  piecePick[player] = key;

  if (piecePick[other] === key) {
    const free = (state.pieces.options || []).find((o) => o.key !== key);
    if (free) piecePick[other] = free.key;

  drawPieceModal();
}

/* ---------- 大富翁：可拖拽图地图 ---------- */
const mapState = { ox: 0, oy: 0, zoom: 1, nodeEls: {}, pendingCenter: null, lastVersion: -1,
  baseOx: 0, baseOy: 0, originX: 0, originY: 0,
  // 渲染底图模式：render=用 Blender 那张图当底图，proj=世界坐标→图像像素的投影函数
  render: false, proj: null,
  // 镜头追踪：follow=还在自动跟随，focus=要跟的那个点，zoomTouch=用户自己滚过轮（这一局不再自动改缩放）
  follow: true, focus: null, focusActor: null, zoomTouch: null, lastGameSeq: null,
  perf:{frames:0,depthPasses:0,staticRebuilds:0,frameIntervals:[]}, viewport:{width:1,height:1} };

// Async mounting must never publish into a newer/different board or retain a detached canvas.
async function mountBoard3D(stage, B3, view) {
  if (mapState.glMounting) return;
  mapState.glMounting = true;
  const current = () => mapState.use3D && stage.isConnected && $("#gl-stage") === stage;
  try {
    const b3 = await B3.createBoard3D(stage, { boardView: view, preset: "showroom", defaultZoom: 1.6,
      blackTrainTheme: globalThis.BoardRuntimeConfig?.blackTrainTheme || null,
      isAmbientBusy: () => !presentationSnapshot().allows('entry') });
    if (current()) mapState.board3d = b3;
    else b3.dispose();
  } catch (e) {
    if (current()) {
      console.warn("3D 初始化失败，回退 DOM 渲染：", e);
      mapState.glFailed = true; // Retry only after page reload, not every poll/render.
      mapState.use3D = false;
    }
  } finally {
    mapState.glMounting = false;
    setTimeout(() => render(), 0); // Render fresh state, never the pre-await game snapshot.
  }
}

/* 世界坐标 → 画布像素。城市图是浮点坐标且不从 0 开始，所以按实际包围盒定原点。 */
function worldBounds(cells) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of cells) {
    if (c.x < minX) minX = c.x;
    if (c.x > maxX) maxX = c.x;
    if (c.y < minY) minY = c.y;
    if (c.y > maxY) maxY = c.y;
  }
  if (!cells.length) { minX = 0; minY = 0; maxX = 1; maxY = 1; }
  const pad = 1.6;   // 留白要容得下河道（世界右边距比最东节点更远）
  mapState.originX = minX - pad;
  mapState.originY = minY - pad;
  return { w: (maxX - minX + pad * 2) * SPACING, h: (maxY - minY + pad * 2) * SPACING };
}
const PX = (x) => (x - mapState.originX) * SPACING;
const PY = (y) => (y - mapState.originY) * SPACING;

/* Catmull-Rom 转三次贝塞尔：把一串节点连成平滑街道（closed=环线首尾相接） */
function smoothPath(pts, closed) {
  const n = pts.length;
  if (n < 2) return "";
  const at = (i) => closed ? pts[((i % n) + n) % n] : pts[Math.min(n - 1, Math.max(0, i))];
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return closed ? d + " Z" : d;
}

/* 一个指向 ang（度）的箭头，尖在 (x,y) */
function chevron(x, y, ang, size, color, opacity) {
  const s = size;
  return `<path d="M${(-s * 0.5).toFixed(1)},${(-s * 0.6).toFixed(1)} L${(s * 0.5).toFixed(1)},0 L${(-s * 0.5).toFixed(1)},${(s * 0.6).toFixed(1)}"
    fill="none" stroke="${color}" stroke-width="${(s * 0.4).toFixed(1)}" stroke-linecap="round"
    stroke-linejoin="round" opacity="${opacity}"
    transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`;
}

function renderMonopoly(game, demo) {
  const cell = 88;
  // "这是新的一局吗"要在函数开头先问好：后面镜头跟随那段会更新 mapState.lastGameSeq，
  // 等到函数末尾再判断就永远是"不是新局"了
  const seqChanged = mapState.lastGameSeq !== state.gameSeq;
  document.documentElement.style.setProperty("--cell", cell + "px");
  // 存档里是 map_kind/main_path，演示棋盘里是 mapKind/mainPath，两种键名都认
  const kindKey = game.mapKind || game.map_kind;
  const isGrid = kindKey === "grid";
  const mainPath = game.main_path || game.mainPath || state.mainPath || null;
  const bounds = worldBounds(game.cells);
  /* 等距（2:1 菱形地砖）布局参数：一格 = ISO.tile 宽、抬高一级 = ISO.step、每块砖厚 = ISO.slab。
     照参考图：路线砖是"深色顶面 + 金色描边 + 浅灰侧面"的厚板，相邻砖差一级就是一级台阶。 */
  const ISO = { tile: 132, step: 30, slab: 54, offX: 0, offY: 0 };
  const isoRaw = (col, row, h) => [
    (col - row) * ISO.tile / 2,
    (col + row) * ISO.tile / 4 - (h || 0) * ISO.step,
  ];
  const isoPos = new Map();
  mapState.iso = isGrid;
  mapState.isoPos = isoPos;
  /* 格子棋盘的底图现在是 Blender 渲染的那张 3D 图（art/board/board_iso.jpg），
     相机参数由 /state 的 boardView 下发。网页不再自己画地砖 —— 按**同一套正交投影**
     把 (格坐标 u,v, 顶面高度 h) 投到渲染图的像素上，图钉/棋子/色块都钉在那个位置上。
     boardView 缺失（还没出图）就退回原来那套矢量等距画法。 */
  const VIEW = (state.boardView && state.boardView.width) ? state.boardView : null;
  mapState.render = isGrid && !!VIEW;
  /* three.js 渲染（2026-10-04）：格子棋盘 + 有相机参数 + 库加载成功 + WebGL 活着 → 走 3D。
     格子演示盘与正式对局共用当前 3D 资源；城市图照旧 DOM 渲染，上下文丢失自动回落。 */
  mapState.use3D = !!(window.Board3D && window.Board3D.createBoard3D
    && isGrid && VIEW && !mapState.glFailed
    && !(mapState.board3d && mapState.board3d.dead));
  if (!mapState.use3D && mapState.board3d) { mapState.board3d.dispose(); mapState.board3d = null; }
  /* 那套"从参考图抠出来的白贴纸图标"只属于等距立体那张格子棋盘（用户 2026-09-21 定）。
     城市图（街道网络）和随机图照旧：地标插画 + 原来那套内联 SVG 徽章。 */
  useStickers = isGrid;
  if (isGrid && VIEW) {
    const K = VIEW.width / VIEW.orthoScale;
    const [tx, ty, tz] = VIEW.target, R = VIEW.right, U = VIEW.up;
    // 世界坐标 → 渲染图像素（正交相机，与 Blender 那台参数一致）
    mapState.proj = (u, v, h) => {
      const dx = u - tx, dy = v - ty, dz = (h || 0) - tz;
      return [VIEW.width / 2 + (dx * R[0] + dy * R[1] + dz * R[2]) * K,
              VIEW.height / 2 - (dx * U[0] + dy * U[1] + dz * U[2]) * K];
    };
    for (const c of game.cells) isoPos.set(c.id, mapState.proj(c.x, c.y, c.h || 0));
    bounds.w = VIEW.width;
    bounds.h = VIEW.height;
  } else if (isGrid) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const c of game.cells) {
      const p = isoRaw(c.col ?? 0, c.row ?? 0, c.h || 0);
      minX = Math.min(minX, p[0] - ISO.tile / 2 - 52);
      maxX = Math.max(maxX, p[0] + ISO.tile / 2 + 52);
      minY = Math.min(minY, p[1] - ISO.tile / 4 - 46);
      maxY = Math.max(maxY, p[1] + ISO.tile / 4 + ISO.slab + 78);
    }
    ISO.offX = -minX; ISO.offY = -minY;
    bounds.w = Math.ceil(maxX - minX);
    bounds.h = Math.ceil(maxY - minY);
    for (const c of game.cells) {
      const p = isoRaw(c.col ?? 0, c.row ?? 0, c.h || 0);
      isoPos.set(c.id, [p[0] + ISO.offX, p[1] + ISO.offY]);
    }
  }
  /* 结构只在"棋盘本身"变化时重建（用户 2026-09-30）：4800px 的底图 <img> 每次渲染
     都重挂一遍的话，每次掷骰/决策都会强制浏览器重新解码布局这张大图 ——
     掷骰动画卡顿的元凶就是它。格子/棋子/高亮这些"动态层"另放专门容器，逐帧替换。 */
  const staticKey = JSON.stringify([state.gameSeq, !!demo, kindKey,
    mapState.use3D ? "gl3d" : (mapState.render ? (VIEW.image || "board_iso.jpg") + ":" + VIEW.width : "vector"),
    Math.round(bounds.w), Math.round(bounds.h),
    !!(state.sameCellRule && state.sameCellRule.on)]);
  if (mapState.staticKey !== staticKey) {
    mapState.staticKey = staticKey;
    // Replacing the DOM invalidates element/listener caches even when a tab
    // roundtrip rebuilds the same logical board key.
    mapState.pieceEls = null; mapState.pieceElsKey = null;
    mapState.panZoomKey = null;
