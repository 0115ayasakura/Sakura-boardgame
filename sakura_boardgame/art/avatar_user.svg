<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#dceaf9"/>
      <stop offset="1" stop-color="#b7d0ea"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3e0"/>
      <stop offset="1" stop-color="#4a86c8"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="46" fill="#ffffff" opacity="0.35"/>

  <!-- 抽象人形剪影：圆头 + 圆肩，无五官 -->
  <circle cx="50" cy="38" r="17" fill="url(#body)"/>
  <path d="M50 59 q23 0 26 24 q0 5-5 5 h-42 q-5 0-5-5 q3-24 26-24z" fill="url(#body)"/>

  <!-- 一点装饰：领口的高光弧 -->
  <path d="M40 66 q10 6 20 0" stroke="#ffffff" stroke-width="3" fill="none"
        stroke-linecap="round" opacity="0.75"/>
</svg>
